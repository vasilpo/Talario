name: UX-01 Dev Copy Safety

on:
  pull_request:
    branches: [development]
    paths:
      - 'js/addons/lr_design_changes/ux01_homepage.js'
      - 'design/themes/abt__unitheme2/css/addons/lr_design_changes/ux01_homepage.less'
      - 'design/themes/abt__unitheme2/templates/addons/lr_design_changes/hooks/index/**'
      - 'tests/ux01/**'
      - 'app/addons/lr_design_changes/**'
      - '.github/workflows/ux01-safety.yml'
  push:
    branches: [development]
    paths:
      - 'js/addons/lr_design_changes/ux01_homepage.js'
      - 'design/themes/abt__unitheme2/css/addons/lr_design_changes/ux01_homepage.less'
      - 'design/themes/abt__unitheme2/templates/addons/lr_design_changes/hooks/index/**'
      - 'tests/ux01/**'
      - 'app/addons/lr_design_changes/**'

permissions:
  contents: read

jobs:
  ux01-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax, safe native DOM reuse and first-name context
        run: node --test tests/ux01/homepage.test.cjs
      - name: Set up PHP for real Smarty hook regression
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Render hooks with mutable homepage runtime and verify PROD exclusion
        run: |
          for test in tests/ux01/*.test.php; do php "$test"; done
