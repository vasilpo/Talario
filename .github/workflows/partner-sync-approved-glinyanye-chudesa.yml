name: PART-SYNC Step 5 Glinyanye Chudesa CREATE preflight only

on:
  push:
    branches:
      - part-sync/clay-safe-failure-diagnostics
    paths:
      - '.github/workflows/partner-sync-approved-glinyanye-chudesa.yml'

permissions:
  contents: read

concurrency:
  group: part-sync-step5-glina-create-preflight
  cancel-in-progress: false

jobs:
  create-preflight:
    if: github.repository == 'vasilpo/Talario' && github.actor == 'vasilpo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate one-shot CREATE contract without network or secrets
        shell: bash
        run: |
          set -euo pipefail

          controller='app/addons/talario_analytics/controllers/frontend/talario_analytics.php'
          writer='app/addons/talario_analytics/partner_sync_write.php'

          # Exact final payload identity prepared outside CI.
          CREATE_PAYLOAD_SHA256='0e4c0eeccb2ffac735d026f0962d5fdb4ca138aaafa21bf8a9273d60c60cac3c'
          CREATE_PAYLOAD_BYTES='2391697'
          APPROVAL_ID='part-sync-glinyanye-chudesa-20260928-step6'
          COMPANY_ID='12'
          CATEGORY_ID='268'
          STATUS='H'
          VARIATIONS='15'
          IMAGES='3'

          [[ "$CREATE_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CREATE_PAYLOAD_BYTES" -gt 0
          test "$CREATE_PAYLOAD_BYTES" -lt 20971520
          [[ "$APPROVAL_ID" =~ ^part-sync-[A-Za-z0-9._:-]{6,112}$ ]]
          test "$COMPANY_ID" = '12'
          test "$CATEGORY_ID" = '268'
          test "$STATUS" = 'H'
          test "$VARIATIONS" = '15'
          test "$IMAGES" = '3'

          # Server-side hard gates required before step 6 is allowed.
          grep -Fq "fn_talario_analytics_partner_sync_verify_penaty_signature('apply', \$raw);" "$controller"
          grep -Fq "if (!\$dry_run) {" "$controller"
          grep -Fq "fn_talario_analytics_partner_sync_bootstrap_approved_age_variants(\$payload);" "$controller"
          grep -Fq "fn_talario_analytics_partner_sync_enable_penaty_request_gate(\$approved_company_id);" "$controller"
          grep -Fq "fn_talario_analytics_partner_sync_run_penaty_cli(\$raw, \$approved_company_id);" "$controller"
          grep -Fq "['error' => 'company_run_approval_required']" "$writer"
          grep -Fq "['error' => 'approval_id_required']" "$writer"
          grep -Fq "fn_talario_analytics_partner_sync_cleanup_failed_create(\$product_id);" "$writer"

          # Step 5 must be incapable of writing anywhere.
          if grep -Eq 'curl|wget|ssh-keygen -Y sign|partner_apply|talario\.ru/dev_copy|talario\.ru/index\.php'             '.github/workflows/partner-sync-approved-glinyanye-chudesa.yml'; then
            echo 'STEP5_NETWORK_OR_SIGNING_PATH_FORBIDDEN'
            exit 91
          fi
          if grep -Eq 'secrets\.|BEGET_SSH_KEY|approval.*POST|--data-binary|-X POST'             '.github/workflows/partner-sync-approved-glinyanye-chudesa.yml'; then
            echo 'STEP5_SECRET_OR_POST_PATH_FORBIDDEN'
            exit 92
          fi

          echo "STEP5_CREATE_PAYLOAD_SHA256=$CREATE_PAYLOAD_SHA256"
          echo "STEP5_CREATE_PAYLOAD_BYTES=$CREATE_PAYLOAD_BYTES"
          echo "STEP5_TARGET=dev_copy_only"
          echo "STEP5_STATUS=H"
          echo "STEP5_IMAGES=3"
          echo "STEP5_VARIATIONS=15"
          echo "STEP5_NETWORK_WRITES=0"
          echo "STEP5_CREATE_PREFLIGHT=PASS"
