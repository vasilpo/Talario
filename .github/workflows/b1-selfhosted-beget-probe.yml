name: B1 Self-hosted Beget Probe\n\non:\n  push:\n    branches:\n      - prod\n    paths:\n      - .github/workflows/b1-selfhosted-beget-probe.yml\n\npermissions:\n  contents: read\n\njobs:\n  probe:\n    if: github.actor == github.repository_owner\n    runs-on: [self-hosted, talario-assistant-vps]\n    timeout-minutes: 10\n    steps:\n      - name: Configure Beget key from repository secret\n        env:\n          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          test -n "$BEGET_SSH_KEY"\n          mkdir -p ~/.ssh\n          chmod 700 ~/.ssh\n          printf '%s' "$BEGET_SSH_KEY" | base64 --decode > ~/.ssh/b1_beget\n          chmod 600 ~/.ssh/b1_beget\n          ssh-keygen -y -f ~/.ssh/b1_beget >/dev/null\n          printf '%s\n' 'salvage.beget.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIs+AhzkOHDQ3wgwojXvZgnfyrnRuRgf83iUmCZJtKhY' > ~/.ssh/b1_beget_known\n          chmod 600 ~/.ssh/b1_beget_known\n\n      - name: Probe unrestricted command capability\n        env:\n          BEGET_USER: ${{ secrets.BEGET_USER }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          RAW="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/b1_beget_known" -i "$HOME/.ssh/b1_beget" "$BEGET_USER@salvage.beget.com" 'printf B1_PROBE_OK' 2>&1 || true)"\n          if [ "$RAW" = "B1_PROBE_OK" ]; then\n            echo 'B1_BEGET_CHANNEL=UNRESTRICTED'\n            exit 0\n          fi\n          echo 'B1_BEGET_CHANNEL=FORCED_OR_BLOCKED'\n          printf '%s\n' "$RAW" | grep -E '^(DISPATCHER=|OPERATION=|ERROR:|REMOTE_OPERATION_FAILED|Unknown|unknown|Permission denied)' | head -10 || true\n          exit 42\n\n      - name: Cleanup\n        if: always()\n        shell: bash\n        run: rm -f ~/.ssh/b1_beget ~/.ssh/b1_beget_known