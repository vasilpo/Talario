name: PART-SYNC Create Glinyanye Chudesa
on:
  push:
    branches: [development]
    paths: ['.github/partner-sync-test/glinyanye-chudesa-v2.json']
permissions:
  contents: read
jobs:
  create:
    if: github.repository == 'vasilpo/Talario' && github.actor == 'vasilpo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign, dry-run, apply
        env:
          SIGNING_KEY: ${{ secrets.BEGET_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > key
          pub="$(ssh-keygen -y -f key | awk '{print $2}')"
          test "$pub" = 'AAAAC3NzaC1lZDI1NTE5AAAAIA/89+6Q50ah8vHptYSd4T6GsrhW+mYwf/xpNyZyAdDP'
          cp .github/partner-sync-test/glinyanye-chudesa-v2.json request.json
          jq 'del(.image_drive_ids)' request.json > base.json
          echo '[]' > images.json
          while read -r id; do
            file="image-$id"
            curl -fsSL "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" -o "$file"
            bytes=$(wc -c < "$file"); test "$bytes" -gt 0; test "$bytes" -le 5242880
            mime=$(file -b --mime-type "$file")
            case "$mime" in image/jpeg|image/png|image/webp) ;; *) echo "RESULT=bad_image_type"; exit 12;; esac
            b64=$(base64 -w0 "$file")
            jq --arg b64 "$b64" '. + [{content_base64:$b64,alt:"Глиняные чудеса"}]' images.json > images.next
            mv images.next images.json
          done < <(jq -r '.image_drive_ids[]' request.json)
          jq --slurpfile imgs images.json '. + {images:$imgs[0]}' base.json > apply.json
          jq '.dry_run=true | del(.approval_id) | .bootstrap_missing_age_variants=false' apply.json > dry.json
          endpoint='https://talario.ru/dev_copy/index.php?dispatch=talario_analytics.partner_apply'
          post_signed() {
            body="$1"; req="$2"; out="$3"
            ts=$(date +%s); hash=$(sha256sum "$body" | awk '{print $1}')
            printf 'talario-part-sync\napply\n%s\n%s\n%s\n' "$req" "$ts" "$hash" > message
            rm -f message.sig
            ssh-keygen -Y sign -q -f key -n talario-part-sync message
            sig=$(base64 -w0 message.sig)
            curl -sS -o "$out" -w '%{http_code}' --max-time 120 -X POST "$endpoint" \
              -H 'Content-Type: application/json' -H "X-Talario-Request-Id: $req" \
              -H "X-Talario-Timestamp: $ts" -H "X-Talario-Signature: $sig" --data-binary "@$body"
          }
          dry_code=$(post_signed dry.json part-sync-apply-glina-dry-v2 dry.out)
          test "$dry_code" = 200
          jq -e '.dry_run == true and .plan.product.status == "H"' dry.out >/dev/null
          apply_code=$(post_signed apply.json part-sync-apply-glina-create-v2 apply.out)
          test "$apply_code" = 201
          jq -e '.readback.status=="H" and .readback.company_id==12 and .readback.images.main==1 and .readback.images.additional==2' apply.out >/dev/null
          jq '{product_id,operation,readback:{company_id:.readback.company_id,name:.readback.name,status:.readback.status,price:.readback.price,images:.readback.images},variations}' apply.out
