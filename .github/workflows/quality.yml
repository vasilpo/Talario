name: Quality & Safety

on:
  pull_request:
    branches:
      - development
      - prod
  push:
    branches:
      - development

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect control request
    runs-on: ubuntu-latest
    outputs:
      control_only: ${{ steps.detect.outputs.control_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect request-only change
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          mapfile -t files < <(git diff --name-only "$BASE" "$HEAD")
          if [ "${#files[@]}" -eq 1 ] && [ "${files[0]}" = ".github/dev-copy-ops/request.json" ]; then
            echo "control_only=true" >> "$GITHUB_OUTPUT"
            echo "CONTROL_REQUEST_ONLY=YES"
          else
            echo "control_only=false" >> "$GITHUB_OUTPUT"
            echo "CONTROL_REQUEST_ONLY=NO"
          fi

  php-syntax:
    needs: scope
    name: PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Control request fast-path
        if: needs.scope.outputs.control_only == 'true'
        run: echo "Request-only control change; PHP setup/lint skipped."

      - name: Set up PHP
        if: needs.scope.outputs.control_only != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint changed PHP files
        if: needs.scope.outputs.control_only != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          mapfile -t files < <(git diff --diff-filter=ACMR --name-only "$BASE" "$HEAD" -- '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed PHP files."
            exit 0
          fi

          printf 'Linting %s changed PHP file(s).\n' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done

  repository-guard:
    needs: scope
    name: Repository safety guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject unsafe artifacts and direct core edits
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          mapfile -t files < <(git diff --name-only "$BASE" "$HEAD")
          printf '%s\n' "${files[@]}"

          failed=0
          for file in "${files[@]}"; do
            case "$file" in
              adminer*.php|*/adminer*.php|error_log|*/error_log|error_log.*|*/error_log.*|.env|*/.env|*.sql|*.sql.gz|*.bak|*.dump)
                echo "::error file=$file::Unsafe runtime/secret/backup artifact must not be committed."
                failed=1
                ;;
            esac

            case "$file" in
              app/functions/*|app/Tygh/*|app/schemas/*)
                echo "::error file=$file::Direct CS-Cart core edit detected. Move the change into a Talario add-on/hook or handle it in a dedicated reviewed exception PR."
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  secret-scan:
    needs: scope
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Control request fast-path
        if: needs.scope.outputs.control_only == 'true'
        run: echo "Request-only control change; secret scan skipped."

      - name: Scan PR/push for secrets
        if: needs.scope.outputs.control_only != 'true'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  partner-sync-tests:
    needs: scope
    name: Partner Sync targeted tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Control request fast-path
        if: needs.scope.outputs.control_only == 'true'
        run: echo "Request-only control change; Partner Sync tests skipped."

      - name: Set up PHP and PHPUnit
        if: needs.scope.outputs.control_only != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: phpunit

      - name: Run Partner Sync contract tests
        if: needs.scope.outputs.control_only != 'true'
        run: phpunit --no-coverage app/addons/talario_analytics/tests/PartnerSyncReadApiContractTest.php

  talario-schedule-resources:
    needs: scope
    name: Talario schedule resource tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Control request fast-path
        if: needs.scope.outputs.control_only == 'true'
        run: echo "Request-only control change; schedule resource tests skipped."

      - name: Set up PHP
        if: needs.scope.outputs.control_only != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Test company boundaries and shared capacity
        if: needs.scope.outputs.control_only != 'true'
        run: bash tests/talario_schedule_resources/run.sh
