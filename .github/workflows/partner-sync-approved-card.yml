name: PART-SYNC Approved Card

on:
  push:
    branches: [development]
    paths:
      - '.github/part-sync/requests/*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: Approved request file under .github/part-sync/requests/
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: partner-sync-approved-card-dev-copy
  cancel-in-progress: false

jobs:
  approved-card:
    if: github.repository == 'vasilpo/Talario' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout approved request
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exactly one approved request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            request="${{ inputs.request_file }}"
          else
            before="${{ github.event.before }}"
            mapfile -t changed < <(git diff --name-only "$before" "${GITHUB_SHA}" -- '.github/part-sync/requests/*.json')
            [ "${#changed[@]}" -eq 1 ] || {
              echo "expected exactly one Partner Sync request change, got ${#changed[@]}" >&2
              printf '%s\n' "${changed[@]}" >&2
              exit 64
            }
            request="${changed[0]}"
          fi
          [[ "$request" =~ ^\.github/part-sync/requests/[A-Za-z0-9._-]+\.json$ ]]
          test -f "$request"
          echo "request_file=$request" >> "$GITHUB_OUTPUT"
          echo "REQUEST_FILE=$request"

      - name: Configure pinned SSH trust
        shell: bash
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${BEGET_SSH_KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$BEGET_SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          derived="$(ssh-keygen -y -f ~/.ssh/id_ed25519)"
          algorithm="$(awk '{print $1}' <<<"$derived")"
          public_key="$(awk '{print $2}' <<<"$derived")"
          test "$algorithm" = "ssh-ed25519"
          [[ "$public_key" =~ ^[A-Za-z0-9+/]+={0,3}$ ]]

          manifest='app/addons/talario_analytics/config/partner_sync_signers.json'
          jq -e '
            .schema_version == "talario.partner-sync.signers.v1"
            and (.signers | type == "array")
            and (.signers | length >= 1 and length <= 4)
          ' "$manifest" >/dev/null
          match_count="$(jq --arg algorithm "$algorithm" --arg public_key "$public_key" '
            [.signers[]
              | select(
                  .algorithm == $algorithm
                  and .public_key == $public_key
                  and (.status == "active" or .status == "next")
                )
            ] | length
          ' "$manifest")"
          test "$match_count" = "1"
          echo "SIGNER_MANIFEST_MATCH=PASS"

          printf '%s\n' 'salvage.beget.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIs+AhzkOHDQ3wgwojXvZgnfyrnRuRgf83iUmCZJtKhY' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/id_ed25519 -E sha256 | awk '{print "SIGNER_FINGERPRINT="$2}'

      - name: Preflight server trust and exact dev_copy revision
        shell: bash
        env:
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -euo pipefail
          test -n "${BEGET_USER:-}"
          matched=0
          for attempt in $(seq 1 24); do
            output="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@salvage.beget.com" "talario-dev-ops status")"
            printf '%s\n' "$output" | grep -F -x 'DISPATCHER=talario-dev-github-v1'
            printf '%s\n' "$output" | grep -F -x 'OPERATION=status'
            printf '%s\n' "$output" | grep -F -x 'BRANCH=development'
            printf '%s\n' "$output" | grep -F -x 'WORKTREE=CLEAN'
            printf '%s\n' "$output" | grep -F -x 'DEV_COPY_FLAG=PRESENT'
            remote_head="$(printf '%s\n' "$output" | awk -F= '$1=="HEAD"{print $2}')"
            if [ "$remote_head" = "${GITHUB_SHA}" ]; then
              matched=1
              echo "DEV_COPY_HEAD_MATCH=PASS"
              break
            fi
            echo "DEV_COPY_WAIT attempt=$attempt"
            sleep 5
          done
          test "$matched" = "1"
          echo 'SSH_TRUST_PREFLIGHT=PASS'
          echo 'DEV_COPY_PREFLIGHT=PASS'

      - name: Signed dry-run, approved create, readback and storefront QA
        shell: bash
        env:
          PARTNER_SYNC_KEY_FILE: /home/runner/.ssh/id_ed25519
        run: |
          bash .github/part-sync/run-approved-card.sh "${{ steps.request.outputs.request_file }}" "${GITHUB_RUN_ATTEMPT}"

      - name: Upload Partner Sync checkpoint and bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-sync-card-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/partner-sync-approved-card-evidence/needs-input.json
            ${{ runner.temp }}/partner-sync-approved-card-evidence/recovery.json
            ${{ runner.temp }}/partner-sync-approved-card-evidence/create-result.json
            ${{ runner.temp }}/partner-sync-approved-card-evidence/summary.txt
            ${{ runner.temp }}/partner-sync-approved-card-evidence/screenshot.png
          retention-days: 14
          if-no-files-found: ignore
