name: PART-SYNC Step 4 Glinyanye Chudesa dry-run only

on:
  push:
    branches:
      - part-sync/clay-safe-failure-diagnostics
    paths:
      - '.github/workflows/part-sync-clay-wonders-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: part-sync-step4-glina-dry-run
  cancel-in-progress: false

jobs:
  dry-run-only:
    if: github.repository == 'vasilpo/Talario' && github.actor == 'vasilpo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build exact validated dry-run payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dry.json
          import json
          ages = [
              ("до 3 лет", ["monday","wednesday"], "10:00", "11:00"),
              ("3-5 лет", ["tuesday","thursday"], "11:00", "12:00"),
              ("6-9 лет", ["wednesday","friday"], "15:00", "16:00"),
          ]
          prices = [
              ("Пробное занятие",0),
              ("Разовое занятие",1500),
              ("Абонемент 4 занятия",3600),
              ("Абонемент 8 занятий",6800),
              ("Абонемент 12 занятий",9600),
          ]
          variations=[]
          for age,days,start,end in ages:
              sessions=[{"day":d,"start":start,"end":end,"duration":60,"capacity":5} for d in days]
              for label,price in prices:
                  variations.append({
                      "age_group":age,
                      "purchase_option":label,
                      "price":price,
                      "capacity":5,
                      "schedule":sessions,
                  })
          payload={
              "operation":"create",
              "dry_run":True,
              "approved_company_id":12,
              "bootstrap_missing_age_variants":False,
              "product":{
                  "company_id":12,
                  "name":"Первая кржука",
                  "price":1500,
                  "category_ids":[268],
                  "status":"H",
                  "short_description":"На занятиях дети знакомятся со свойствами глины, осваивают разные способы лепки и создают собственные изделия.",
                  "full_description":"<p>На занятиях дети знакомятся со свойствами глины, учатся правильно с ней работать, осваивают разные способы и техники лепки и постепенно создают собственные изделия.</p><p>Можно придумать свою идею или сделать работу вместе с мастером: посуду, фигурки, декоративные изделия и многое другое.</p><p>Работа с глиной развивает мелкую моторику, воображение, чувство формы, аккуратность и творческое мышление. А ещё это увлекательный процесс, в котором ребёнок может отвлечься от гаджетов и полностью погрузиться в творчество.</p><p><strong>Что взять с собой:</strong> воду.</p><h3>Возраст и расписание</h3><ul><li><strong>до 3 лет</strong> — Понедельник, Среда: 10:00–11:00. Свободных мест: 5.</li><li><strong>3-5 лет</strong> — Вторник, Четверг: 11:00–12:00. Свободных мест: 5.</li><li><strong>6-9 лет</strong> — Среда, Пятница: 15:00–16:00. Свободных мест: 5.</li></ul><p><strong>Длительность занятия:</strong> 60 минут.</p><p>В онлайн-календаре <strong>Таларио</strong> отображается актуальное расписание и количество свободных мест. Вы можете увидеть доступные места и сразу записаться на занятие.</p><h3>Стоимость занятий</h3><ul><li>Пробное занятие — бесплатно.</li><li>Разовое занятие — 1 500 ₽.</li><li>Абонемент 4 занятия — 3 600 ₽.</li><li>Абонемент 8 занятий — 6 800 ₽.</li><li>Абонемент 12 занятий — 9 600 ₽.</li></ul><h3>Адрес</h3><p><strong>г.Красногорск, ул Осеняя 1стр1</strong></p><p>Парковка: Есть, общая во дворе.</p><p>Как найти: Зайти во двор дома, повернуть направо, идти вдоль дома. Будет белая дверь с названием.</p>",
                  "meta_keywords":"керамика, глина, лепка, дети, Красногорск"
              },
              "booking":{
                  "from":"2026-09-28",
                  "to":"2027-09-28",
                  "slot_time":60,
                  "free_time":0,
                  "days":{
                      "monday":{"enabled":True,"start":"10:00","end":"11:00"},
                      "tuesday":{"enabled":False,"start":"","end":""},
                      "wednesday":{"enabled":True,"start":"10:00","end":"11:00"},
                      "thursday":{"enabled":False,"start":"","end":""},
                      "friday":{"enabled":False,"start":"","end":""},
                      "saturday":{"enabled":False,"start":"","end":""},
                      "sunday":{"enabled":False,"start":"","end":""}
                  }
              },
              "capacity":5,
              "variation_plan":variations,
              "images":[
                  {"verified_source_image":True},
                  {"verified_source_image":True},
                  {"verified_source_image":True}
              ]
          }
          assert len(variations)==15
          assert payload["dry_run"] is True
          assert "approval_id" not in payload
          print(json.dumps(payload,ensure_ascii=False,separators=(",",":")))
          PY

          jq -e '
            .dry_run == true
            and .operation == "create"
            and .approved_company_id == 12
            and .product.company_id == 12
            and .product.status == "H"
            and .product.category_ids == [268]
            and (.variation_plan|length) == 15
            and (.images|length) == 3
            and (has("approval_id")|not)
          ' /tmp/dry.json >/dev/null
          echo "STEP4_PAYLOAD=PASS"

      - name: One signed dev_copy dry-run only
        env:
          SIGNING_KEY: ${{ secrets.BEGET_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEY:-}"
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"; rm -f /tmp/dry.json' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$work/key"
          chmod 600 "$work/key"
          actual="$(ssh-keygen -y -f "$work/key" | awk '{print $2}')"
          test "$actual" = "AAAAC3NzaC1lZDI1NTE5AAAAIA/89+6Q50ah8vHptYSd4T6GsrhW+mYwf/xpNyZyAdDP"

          endpoint='https://talario.ru/dev_copy/index.php?dispatch=talario_analytics.partner_apply'
          req="part-sync-apply-glina-step4-${GITHUB_RUN_ID}"
          ts="$(date +%s)"
          body_hash="$(sha256sum /tmp/dry.json | awk '{print $1}')"
          printf 'talario-part-sync\napply\n%s\n%s\n%s\n' "$req" "$ts" "$body_hash" > "$work/message"
          ssh-keygen -Y sign -q -f "$work/key" -n talario-part-sync "$work/message"
          sig="$(base64 < "$work/message.sig" | tr -d '\n')"

          code="$(curl --silent --show-error --output "$work/dry.out" --write-out '%{http_code}' --max-time 120 \
            -X POST "$endpoint" \
            -H 'Content-Type: application/json' \
            -H "X-Talario-Request-Id: $req" \
            -H "X-Talario-Timestamp: $ts" \
            -H "X-Talario-Signature: $sig" \
            --data-binary @/tmp/dry.json)"

          echo "STEP4_HTTP=$code"
          test "$code" = "200"
          jq -e '
            .schema_version == "partner-sync.write-plan.v1"
            and .dry_run == true
            and .plan.operation == "create"
            and .plan.product.company_id == 12
            and .plan.product.product == "Первая кржука"
            and .plan.product.status == "H"
            and .plan.product.category_ids == [268]
            and .plan.images.count == 3
            and .plan.variations.count == 15
          ' "$work/dry.out" >/dev/null
          echo "STEP4_DRY_RUN=PASS"
          jq -c '{dry_run,operation:.plan.operation,company_id:.plan.product.company_id,name:.plan.product.product,status:.plan.product.status,categories:.plan.product.category_ids,images:.plan.images.count,variations:.plan.variations.count}' "$work/dry.out"
