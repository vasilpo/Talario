name: PART-SYNC Clay Wonders dry-run
on:
  push:
    branches: [development]
    paths: [".github/part-sync/clay-wonders-request.json"]
permissions:
  contents: read
jobs:
  dry-run:
    if: github.repository == 'vasilpo/Talario' && github.actor == 'vasilpo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Signed dry-run
        env:
          SIGNING_KEY: ${{ secrets.BEGET_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEY:-}" || { echo "RESULT=missing_signing_key_secret"; exit 2; }
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > key
          pub="$(ssh-keygen -y -f key | awk '{print $2}')"
          test "$pub" = "AAAAC3NzaC1lZDI1NTE5AAAAIA/89+6Q50ah8vHptYSd4T6GsrhW+mYwf/xpNyZyAdDP" || { echo "RESULT=signing_key_mismatch"; exit 3; }
          python3 - <<'PY'
          import json
          description = """<p>На занятиях дети знакомятся со свойствами глины, учатся правильно с ней работать, осваивают разные способы и техники лепки и постепенно создают собственные изделия.</p><p>Можно придумать свою идею или сделать работу вместе с мастером: посуду, фигурки, декоративные изделия и многое другое.</p><p>Работа с глиной развивает мелкую моторику, воображение, чувство формы, аккуратность и творческое мышление. А ещё это увлекательный процесс, в котором ребёнок может отвлечься от гаджетов и полностью погрузиться в творчество.</p><p><strong>Что взять с собой:</strong> сменную обувь и бутылочку с водой.</p><h3>Возраст и расписание</h3><ul><li><strong>До 3 лет</strong> — понедельник, среда, 10:00–11:00.</li><li><strong>3–5 лет</strong> — вторник, четверг, 11:00–12:00.</li><li><strong>6–9 лет</strong> — среда, пятница, 15:00–16:00.</li><li>На каждое время доступно <strong>5 мест</strong>.</li></ul><p><strong>Занятие</strong> длится 60 минут.</p><p>В онлайн-календаре <strong>Таларио</strong> отображается актуальное расписание и количество свободных мест. Вы можете увидеть доступные места и сразу записаться на занятие.</p><h3>Стоимость занятий</h3><ul><li><strong>Пробное занятие — бесплатно</strong></li><li>Разовое занятие — 1500 ₽</li><li>Абонемент на 4 занятия — 3600 ₽</li><li>Абонемент на 8 занятий — 6800 ₽</li><li>Абонемент на 12 занятий — 9600 ₽</li></ul><h3>Адрес</h3><p><strong>Красногорск, ул. Осенняя, д. 1, стр. 1</strong></p><p>Есть общая парковка во дворе. Зайдите во двор дома, поверните направо и идите вдоль дома до белой двери с названием.</p><div style="position:relative;overflow:hidden;"><iframe src="https://yandex.ru/map-widget/v1/?mode=search&amp;text=%D0%9A%D1%80%D0%B0%D1%81%D0%BD%D0%BE%D0%B3%D0%BE%D1%80%D1%81%D0%BA%2C%20%D1%83%D0%BB.%20%D0%9E%D1%81%D0%B5%D0%BD%D0%BD%D1%8F%D1%8F%2C%201%2C%20%D1%81%D1%82%D1%80.%201&amp;z=16" width="100%" height="400" frameborder="1" allowfullscreen="true" style="position:relative;"></iframe></div>"""
          schedules={"до 3 лет":[("monday","10:00","11:00"),("wednesday","10:00","11:00")],"3-5 лет":[("tuesday","11:00","12:00"),("thursday","11:00","12:00")],"6-9 лет":[("wednesday","15:00","16:00"),("friday","15:00","16:00")]}
          prices=[("Пробное занятие",0),("Разовое занятие",1500),("Абонемент 4 занятия",3600),("Абонемент 8 занятий",6800),("Абонемент 12 занятий",9600)]
          vp=[]
          for age,sessions in schedules.items():
              sch=[{"day":d,"start":s,"end":e,"duration":60} for d,s,e in sessions]
              for option,price in prices:
                  vp.append({"age_group":age,"purchase_option":option,"price":price,"capacity":5,"schedule":sch})
          payload={"operation":"create","dry_run":True,"approved_company_name":"Глиняные Чудеса","category_name":"Творчество","product":{"name":"Первая кржука","price":0,"status":"H","full_description":description},"booking":{"from":"2026-09-28","to":"2027-09-28","slot_time":60,"free_time":0,"days":{"monday":{"enabled":True,"start":"10:00","end":"11:00"}}},"variation_plan":vp}
          open("payload.json","w",encoding="utf-8").write(json.dumps(payload,ensure_ascii=False,separators=(",",":")))
          PY
          request_id="part-sync-apply-clay-wonders-dryrun"
          ts="$(date +%s)"
          hash="$(sha256sum payload.json | awk '{print $1}')"
          printf 'talario-part-sync\napply\n%s\n%s\n%s\n' "$request_id" "$ts" "$hash" > message
          ssh-keygen -Y sign -f key -n talario-part-sync message >/dev/null
          sig="$(base64 -w0 message.sig)"
          code="$(curl -sS -o response.json -w '%{http_code}' --max-time 60 -X POST 'https://talario.ru/dev_copy/index.php?dispatch=talario_analytics.partner_apply' -H "Content-Type: application/json" -H "X-Talario-Request-Id: $request_id" -H "X-Talario-Timestamp: $ts" -H "X-Talario-Signature: $sig" --data-binary @payload.json)"
          echo "HTTP_STATUS=$code"
          python3 -c 'import json; print(json.dumps(json.load(open("response.json")),ensure_ascii=False))'
          test "$code" = "200"
