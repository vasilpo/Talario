name: PART-SYNC Step 6B Glinyanye Chudesa one-shot CREATE

on:
  push:
    branches:
      - part-sync/clay-safe-failure-diagnostics
    paths:
      - '.github/workflows/part-sync-clay-wonders-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: part-sync-step6b-glina-create
  cancel-in-progress: false

jobs:
  one-shot-create:
    if: github.repository == 'vasilpo/Talario' && github.actor == 'vasilpo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-10a4-820a-8875-7437dde0518f/raw?se=2026-09-28T20%3A09%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=0a2441b3-0e02-50ff-99d8-37e359fcb0a1&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T19%3A45%3A03Z&ske=2026-09-29T19%3A45%3A03Z&sks=b&skv=2026-02-06&sig=v%2BoBnu96Yj8XJGpovWJduWYTcb2H3ROjNVqSc/l7jE8%3D'
      ARTIFACT_SHA256: 'df84953e2b441d64daf89685a9a92c05b3084143dad4aaffcf3a762a7600f094'
      PAYLOAD_SHA256: '0e4c0eeccb2ffac735d026f0962d5fdb4ca138aaafa21bf8a9273d60c60cac3c'
      PAYLOAD_BYTES: '2391697'
    steps:
      - name: Fetch encrypted handoff only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/part-sync-step6b"
          rm -rf "$work"
          install -d -m 700 "$work"
          curl --fail --location --silent --show-error --max-time 90 \
            "$ARTIFACT_URL" -o "$work/handoff.zip"
          test "$(sha256sum "$work/handoff.zip" | awk '{print $1}')" = "$ARTIFACT_SHA256"
          unzip -q "$work/handoff.zip" -d "$work/handoff"
          test -f "$work/handoff/envelope.json"
          test "$(find "$work/handoff" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          python3 - "$work/handoff/envelope.json" <<'PY'
          import json,sys
          e=json.load(open(sys.argv[1],encoding="utf-8"))
          assert e["schema_version"]=="talario.part-sync.encrypted-create.v1"
          assert e["aad"]=="talario-part-sync-step6-create-v1"
          assert e["plaintext_sha256"]=="0e4c0eeccb2ffac735d026f0962d5fdb4ca138aaafa21bf8a9273d60c60cac3c"
          assert e["plaintext_bytes"]==2391697
          assert e["policy"]=={
              "target":"dev_copy","operation":"create","dry_run":False,"company_id":12,
              "category_id":268,"status":"H","variation_count":15,"image_count":3,
              "auto_retry":False,"expected_http":201
          }
          print("STEP6B_ENCRYPTED_HANDOFF=PASS")
          PY

      - name: Decrypt and verify exact approved CREATE payload
        env:
          SIGNING_KEY: ${{ secrets.BEGET_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/part-sync-step6b"
          test -n "${SIGNING_KEY:-}"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$work/key"
          chmod 600 "$work/key"
          pub="$(ssh-keygen -y -f "$work/key" | awk '{print $2}')"
          test "$pub" = "AAAAC3NzaC1lZDI1NTE5AAAAIA/89+6Q50ah8vHptYSd4T6GsrhW+mYwf/xpNyZyAdDP"
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'cryptography==46.0.4' >/dev/null

          python3 - "$work/handoff/envelope.json" "$work/key" "$work/apply.json" <<'PY'
          import base64,hashlib,json,sys
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import ed25519,x25519
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF

          env_path,key_path,out_path=sys.argv[1:4]
          e=json.load(open(env_path,encoding="utf-8"))
          private_key=serialization.load_ssh_private_key(open(key_path,"rb").read(),password=None)
          if not isinstance(private_key,ed25519.Ed25519PrivateKey):
              raise SystemExit("SIGNING_KEY_TYPE_INVALID")
          seed=private_key.private_bytes(
              serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption()
          )
          h=hashlib.sha512(seed).digest()
          scalar=bytearray(h[:32]); scalar[0]&=248; scalar[31]&=127; scalar[31]|=64
          curve_private=x25519.X25519PrivateKey.from_private_bytes(bytes(scalar))
          ephemeral=x25519.X25519PublicKey.from_public_bytes(
              base64.b64decode(e["ephemeral_x25519_public_b64"],validate=True)
          )
          aad=e["aad"].encode("utf-8")
          shared=curve_private.exchange(ephemeral)
          key=HKDF(algorithm=hashes.SHA256(),length=32,salt=None,info=aad).derive(shared)
          raw=ChaCha20Poly1305(key).decrypt(
              base64.b64decode(e["nonce_b64"],validate=True),
              base64.b64decode(e["ciphertext_b64"],validate=True),
              aad,
          )
          actual_sha=hashlib.sha256(raw).hexdigest()
          if len(raw)!=2391697 or actual_sha!="0e4c0eeccb2ffac735d026f0962d5fdb4ca138aaafa21bf8a9273d60c60cac3c":
              raise SystemExit("DECRYPTED_PAYLOAD_PIN_MISMATCH")

          p=json.loads(raw)
          assert list(p.keys())==[
              "operation","dry_run","approved_company_id","bootstrap_missing_age_variants",
              "product","booking","capacity","variation_plan","images","approval_id"
          ]
          assert p["operation"]=="create"
          assert p["dry_run"] is False
          assert p["approval_id"]=="part-sync-glinyanye-chudesa-20260928-step6"
          assert p["approved_company_id"]==12
          assert p["bootstrap_missing_age_variants"] is True
          assert p["product"]["company_id"]==12
          assert p["product"]["name"]=="Первая кржука"
          assert p["product"]["status"]=="H"
          assert p["product"]["category_ids"]==[268]
          assert p["product"]["price"]==1500
          assert "<iframe" not in p["product"]["full_description"]
          assert "map-widget" not in p["product"]["full_description"]
          assert len(p["variation_plan"])==15
          assert sorted(set(int(v["price"]) for v in p["variation_plan"]))==[0,1500,3600,6800,9600]
          assert sorted(set(int(v["capacity"]) for v in p["variation_plan"]))==[5]
          assert sorted(set(int(s["duration"]) for v in p["variation_plan"] for s in v["schedule"]))==[60]

          expected={
              "1lTISmlz74-JAMCOLST9GFD93gXUPNhYg":("2bc3bebea638a37b5550a7e366e40c1e00c403d95988331bed2c9156c36b5f49",1333492),
              "1lrG4Y9JPyFcA-BF02s6_7MPQxVo4XLij":("5b1b957d211b22a6b6ef201899daedeb973bb9e3bec0649dd8dbd89cb3d44fb9",393816),
              "1Xv1qQNhMWU2i2pBBWFIG1OCIOoh_IUA0":("ea95cc2758b3185bd8ab24717494f9378c45c46024b510faaced1d21c17b3b21",60168),
          }
          assert len(p["images"])==3
          assert [i["source_drive_id"] for i in p["images"]]==list(expected)
          for image in p["images"]:
              sha,size=expected[image["source_drive_id"]]
              binary=base64.b64decode(image["content_base64"],validate=True)
              assert len(binary)==size==int(image["source_bytes"])
              assert hashlib.sha256(binary).hexdigest()==sha==image["source_sha256"]
              assert binary[:2]==b"\xff\xd8"

          open(out_path,"wb").write(raw)
          print("STEP6B_DECRYPT=PASS")
          print("STEP6B_PAYLOAD=PASS")
          print("STEP6B_PHOTOS=PASS count=3")
          PY

          test "$(wc -c < "$work/apply.json" | tr -d ' ')" = "$PAYLOAD_BYTES"
          test "$(sha256sum "$work/apply.json" | awk '{print $1}')" = "$PAYLOAD_SHA256"

      - name: Exactly one signed CREATE to dev_copy
        env:
          SIGNING_KEY: ${{ secrets.BEGET_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/part-sync-step6b"
          endpoint='https://talario.ru/dev_copy/index.php?dispatch=talario_analytics.partner_apply'
          req="part-sync-apply-glina-step6-${GITHUB_RUN_ID}"
          ts="$(date +%s)"
          body_hash="$(sha256sum "$work/apply.json" | awk '{print $1}')"
          test "$body_hash" = "$PAYLOAD_SHA256"

          printf 'talario-part-sync\napply\n%s\n%s\n%s\n' "$req" "$ts" "$body_hash" > "$work/message"
          ssh-keygen -Y sign -q -f "$work/key" -n talario-part-sync "$work/message"
          sig="$(base64 < "$work/message.sig" | tr -d '\n')"

          echo "STEP6B_CREATE_ATTEMPTS=1"
          code="$(curl --silent --show-error --output "$work/apply.out" --write-out '%{http_code}' \
            --connect-timeout 15 --max-time 180 \
            -X POST "$endpoint" \
            -H 'Content-Type: application/json' \
            -H "X-Talario-Request-Id: $req" \
            -H "X-Talario-Timestamp: $ts" \
            -H "X-Talario-Signature: $sig" \
            --data-binary "@$work/apply.json")"

          echo "STEP6B_HTTP=$code"
          if [ "$code" != "201" ]; then
            echo "STEP6B_CREATE=STOP_NON_201"
            jq -c '{error:(.error // null),runner_rc:(.runner_rc // null),operation:(.operation // null),dry_run:(.dry_run // null)}' "$work/apply.out" 2>/dev/null || true
            exit 61
          fi

          python3 - "$work/apply.json" "$work/apply.out" <<'PY'
          import json,sys
          expected=json.load(open(sys.argv[1],encoding="utf-8"))
          r=json.load(open(sys.argv[2],encoding="utf-8"))
          assert r.get("dry_run") is False
          assert r.get("operation")=="create"
          assert int(r["readback"]["company_id"])==12
          assert r["readback"]["name"]=="Первая кржука"
          assert r["readback"]["status"]=="H"
          assert float(r["readback"]["price"])==1500.0
          assert r["readback"]["full_description"]==expected["product"]["full_description"]
          assert int(r["readback"]["images"]["main"])==1
          assert int(r["readback"]["images"]["additional"])==2
          assert int(r["variations"]["count"])==15
          items=r["variations"]["items"]
          assert sorted(set(int(float(v["price"])) for v in items))==[0,1500,3600,6800,9600]
          assert sorted(set(int(s["capacity"]) for v in items for s in v["schedule"]))==[5]
          assert sorted(set(int(v["duration"]) for v in items))==[60]
          assert int(r["product_id"])>0
          print("STEP6B_READBACK=PASS")
          print("STEP6B_PRODUCT_ID="+str(int(r["product_id"])))
          print("STEP6B_RESULT=PASS")
          PY

      - name: Cleanup plaintext and key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/part-sync-step6b"
