name: PART-SYNC Clay Wonders approved create
on:
  push:
    branches: [development]
    paths: [".github/part-sync/glinyanye-chudesa-create.json"]
permissions:
  contents: read
jobs:
  approved-create:
    if: github.repository == 'vasilpo/Talario' && github.actor == 'vasilpo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Require explicit authenticated rerun
        if: github.run_attempt == 1
        shell: bash
        run: |
          echo "RESULT=manual_rerun_required"
          exit 78

      - name: Reject repeated attempts
        if: github.run_attempt > 2
        shell: bash
        run: |
          echo "RESULT=run_attempt_not_allowed"
          exit 79

      - name: Signed dry-run then approved dev_copy create
        if: github.run_attempt == 2
        env:
          SIGNING_KEY: ${{ secrets.BEGET_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEY:-}" || exit 2
          for tool in jq curl sha256sum file base64 ssh-keygen awk tr wc mktemp date; do
            command -v "$tool" >/dev/null 2>&1 || exit 18
          done
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > key
          chmod 600 key
          actual="$(ssh-keygen -y -f key | awk '{print $2}')"
          test "$actual" = "AAAAC3NzaC1lZDI1NTE5AAAAIGidfZj2eTRsCFo/USIeuxVhS5N+s//POpGqn0gSgXqK"

          cp .github/part-sync/glinyanye-chudesa-create.json request.json
          jq 'del(.image_drive_files,.source_type,.request_id)' request.json > base.json
          echo '[]' > images.json
          image_tmpdir="$(mktemp -d)"
          trap 'rm -rf "$image_tmpdir"; rm -f key message message.sig' EXIT
          while read -r entry; do
            id="$(jq -r '.id' <<<"$entry")"
            expected_sha="$(jq -r '.sha256' <<<"$entry")"
            expected_bytes="$(jq -r '.bytes' <<<"$entry")"
            if ! [[ "$id" =~ ^[A-Za-z0-9_-]+$ ]]; then exit 13; fi
            if ! [[ "$expected_sha" =~ ^[0-9A-Fa-f]{64}$ ]]; then exit 14; fi
            expected_sha="$(printf '%s' "$expected_sha" | tr '[:upper:]' '[:lower:]')"
            if ! [[ "$expected_bytes" =~ ^[0-9]+$ ]]; then exit 15; fi
            if ! test "$expected_bytes" -gt 0; then exit 16; fi
            if ! test "$expected_bytes" -le 5242880; then exit 17; fi
            file="$image_tmpdir/source-image"
            curl --fail --location --silent --show-error --tlsv1.2 --max-time 60 --max-filesize 5242880               "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"               --output "$file"
            bytes="$(wc -c < "$file" | tr -d '[:space:]')"
            test "$bytes" -eq "$expected_bytes"
            actual_sha="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha"
            mime="$(file --brief --mime-type "$file")"
            case "$mime" in image/jpeg|image/png|image/webp) ;; *) exit 12;; esac
            b64="$(base64 < "$file" | tr -d '\n')"
            jq --arg b64 "$b64" '. + [{content_base64:$b64,alt:"Глиняные Чудеса — керамика"}]' images.json > images.next
            mv images.next images.json
          done < <(jq -c '.image_drive_files[]' request.json)
          echo "::notice::PART-SYNC source images verified"

          jq --slurpfile imgs images.json '. + {images:$imgs[0]}' base.json > apply.json
          jq '.dry_run=true | del(.approval_id) | .bootstrap_missing_age_variants=false' apply.json > dry.json
          endpoint='https://talario.ru/dev_copy/index.php?dispatch=talario_analytics.partner_apply'

          post_signed() {
            body="$1"; req="$2"; out="$3"
            ts="$(date +%s)"
            hash="$(sha256sum "$body" | awk '{print $1}')"
            printf 'talario-part-sync\napply\n%s\n%s\n%s\n' "$req" "$ts" "$hash" > message
            rm -f message.sig
            ssh-keygen -Y sign -q -f key -n talario-part-sync message
            sig="$(base64 < message.sig | tr -d '\n')"
            curl --silent --show-error --output "$out" --write-out '%{http_code}' --max-time 120               -X POST "$endpoint"               -H 'Content-Type: application/json'               -H "X-Talario-Request-Id: $req"               -H "X-Talario-Timestamp: $ts"               -H "X-Talario-Signature: $sig"               --data-binary "@$body"
          }

          dry_code="$(post_signed dry.json "part-sync-apply-glina-${GITHUB_RUN_ID}-dry" dry.out)"
          echo "::notice::PART-SYNC dry-run HTTP $dry_code"
          test "$dry_code" = "200"
          jq -e '
            .dry_run == true
            and .plan.product.company_id == 12
            and .plan.product.product == "Первый удар"
            and .plan.product.status == "H"
            and .plan.product.address == "г.Красногорск, ул Ленина 1стр1"
            and (.plan.product.category_ids | length) == 1
            and .plan.images.count == 0
            and .plan.filter_features.ages == [1,2,3,4,5,6,7,8,9]
            and .plan.filter_features.category == "Единоборства"
            and .plan.variations.resolved == true
            and .plan.variations.count == 15
            and (.plan.variation_booking_windows | length) == 15
          ' dry.out >/dev/null
          echo "::notice::SIGNED_DRY_RUN=PASS"

          apply_code="$(post_signed apply.json "part-sync-apply-glina-${GITHUB_RUN_ID}-create" apply.out)"
          echo "::notice::PART-SYNC apply HTTP $apply_code"
          test "$apply_code" = "201"
          jq -e --slurpfile expected base.json '
            .dry_run == false
            and .operation == "create"
            and .readback.company_id == 12
            and .readback.name == "Первый удар"
            and .readback.status == "H"
            and .readback.address == "г.Красногорск, ул Ленина 1стр1"
            and .readback.details_layout == "default"
            and .readback.popularity >= 1000
            and .readback.images.main == 0
            and .readback.images.additional == 0
            and .readback.full_description == $expected[0].product.full_description
            and .readback.filter_features.ages == [1,2,3,4,5,6,7,8,9]
            and .readback.filter_features.category == "Единоборства"
            and .variations.count == 15
            and ([.variations.items[].schedule[] | .capacity] | unique) == [5]
            and ([.variations.items[].duration] | unique) == [60]
          ' apply.out >/dev/null
          echo "::notice::CREATE_READBACK=PASS"

          jq --slurpfile expected base.json '{
            product_id,
            operation,
            company_id:.readback.company_id,
            name:.readback.name,
            status:.readback.status,
            base_price:.readback.price,
            images:.readback.images,
            description_match:(.readback.full_description == $expected[0].product.full_description),
            address:.readback.address,
            filter_features:.readback.filter_features,
            variation_count:.variations.count,
            variations:.variations.items
          }' apply.out

          product_id="$(jq -r '.product_id' apply.out)"
          test "$product_id" -gt 0
          jq -n --argjson product_id "$product_id" '{product_id:$product_id,approved_company_id:12}' > preview.json
          preview_req='part-sync-penaty-preview-20260924'
          preview_ts="$(date +%s)"
          preview_hash="$(sha256sum preview.json | awk '{print $1}')"
          printf 'talario-part-sync-penaty\npreview\n%s\n%s\n%s\n' "$preview_req" "$preview_ts" "$preview_hash" > preview.message
          rm -f preview.message.sig
          ssh-keygen -Y sign -q -f key -n talario-part-sync preview.message
          preview_sig="$(base64 < preview.message.sig | tr -d '\n')"
          preview_code="$(curl --silent --show-error --output preview.out --write-out '%{http_code}' --max-time 60 \
            -X POST 'https://talario.ru/dev_copy/index.php?dispatch=talario_analytics.penaty_preview' \
            -H 'Content-Type: application/json' \
            -H "X-Talario-Request-Id: $preview_req" \
            -H "X-Talario-Timestamp: $preview_ts" \
            -H "X-Talario-Signature: $preview_sig" \
            --data-binary @preview.json)"
          echo "::notice::PART-SYNC signed preview HTTP $preview_code"
          test "$preview_code" = "200"
          jq -e --argjson pid "$product_id" '
            .schema_version == "partner-sync.preview.v4"
            and .product_id == $pid
            and .company_id == 12
            and .status == "H"
            and .single_use == true
            and .visibility.preview == true
            and .visibility.company_scope == true
            and (.preview_url | startswith("https://talario.ru/dev_copy/"))
          ' preview.out >/dev/null

          preview_url="$(jq -r '.preview_url' preview.out)"
          storefront_code="$(curl --silent --show-error --location --max-time 90 \
            --cookie-jar storefront.cookies --cookie storefront.cookies \
            --output storefront.html --write-out '%{http_code}' "$preview_url")"
          echo "::notice::PART-SYNC storefront HTTP $storefront_code"
          test "$storefront_code" = "200"
          grep -F 'Первый удар' storefront.html >/dev/null
          grep -F 'Глиняные Чудеса' storefront.html >/dev/null
          grep -F 'Ленина 1стр1' storefront.html >/dev/null
          grep -F 'Расписание' storefront.html >/dev/null
          if grep -qi 'магазин закрыт на обслуживание' storefront.html; then exit 44; fi
          if grep -qi 'страница не найдена' storefront.html; then exit 45; fi
          echo "::notice::STOREFRONT_CARD=PASS"
