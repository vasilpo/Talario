name: Deploy development to dev_copy

on:
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure pinned SSH host key
        shell: bash
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$BEGET_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$BEGET_SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' 'salvage.beget.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIs+AhzkOHDQ3wgwojXvZgnfyrnRuRgf83iUmCZJtKhY' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy development
        shell: bash
        env:
          # Explicitly step-scoped; must match the pinned known_hosts entry below.
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -euo pipefail
          BEGET_HOST="salvage.beget.com"

          set +e
          OUTPUT="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" talario-dev-deploy)"
          SSH_RC=$?
          set -e

          if [ "$SSH_RC" -ne 0 ]; then
            echo "REMOTE_DEPLOY_FAILED rc=$SSH_RC"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" "talario-dev-ops status" 2>/dev/null \
              | grep -E '^(DISPATCHER=talario-dev-github-v1|OPERATION=status|BRANCH=development|HEAD=[0-9a-f]{40}|WORKTREE=(CLEAN|DIRTY)|PHP=[0-9.]+|DEV_COPY_FLAG=(PRESENT|MISSING)|PARTNER_SYNC_HASH=(PRESENT|MISSING))$' \
              || true
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" "talario-dev-ops git-status" 2>/dev/null \
              | grep -E '^(DISPATCHER=talario-dev-github-v1|OPERATION=git-status|HEAD=[0-9a-f]{40}|DIRTY_COUNT=[0-9]+)$' \
              || true
            exit "$SSH_RC"
          fi

          DISPATCHER_LINE="$(printf '%s\n' "$OUTPUT" | grep -F -x 'DISPATCHER=talario-dev-github-v1')"
          DEPLOY_LINE="$(printf '%s\n' "$OUTPUT" | grep -E '^DEPLOY_OK [[:xdigit:]]+$')"

          test "$DISPATCHER_LINE" = "DISPATCHER=talario-dev-github-v1"
          test -n "$DEPLOY_LINE"

          printf '%s\n' "$DISPATCHER_LINE"
          printf '%s\n' "$DEPLOY_LINE"

      - name: PART-SYNC Step 7.7 read-only feature discovery
        if: "${{ contains(github.event.head_commit.message, 'PART-SYNC: feature discovery probe') }}"
        shell: bash
        env:
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -euo pipefail
          BEGET_HOST="salvage.beget.com"

          set +e
          RAW_OUTPUT="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" talario-partner-sync-feature-discovery 2>&1)"
          RC=$?
          set -e

          MARKERS="$(printf '%s\n' "$RAW_OUTPUT" | grep -E '^(DISPATCHER=talario-dev-github-v1|OPERATION=partner-sync-feature-discovery)$' || true)"
          DISCOVERY="$(printf '%s\n' "$RAW_OUTPUT" | jq -Rrc 'fromjson? | select(.schema_version == "partner-sync.feature-discovery.v1") | {schema_version, source, features, samples}' | tail -1)"
          SAFE_ERROR="$(printf '%s\n' "$RAW_OUTPUT" | grep -E '^PARTNER_SYNC_FEATURE_DISCOVERY_[A-Z_]+$' | tail -1 || true)"

          printf '%s\n' "$MARKERS"
          if [ -n "$DISCOVERY" ]; then
            printf 'DISCOVERY=%s\n' "$DISCOVERY"
          elif [ -n "$SAFE_ERROR" ]; then
            printf 'DISCOVERY_ERROR=%s\n' "$SAFE_ERROR"
          else
            printf 'DISCOVERY_ERROR=REMOTE_OPERATION_FAILED_rc_%s\n' "$RC"
          fi

          [ "$RC" -eq 0 ]
          [ -n "$DISCOVERY" ]

      - name: PART-SYNC Step 7 filter acceptance
        if: "${{ contains(github.event.head_commit.message, 'PART-SYNC: step7 filter acceptance runner') }}"
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SIGNER='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA/89+6Q50ah8vHptYSd4T6GsrhW+mYwf/xpNyZyAdDP'
          ACTUAL_SIGNER="$(ssh-keygen -y -f ~/.ssh/id_ed25519)"
          test "$ACTUAL_SIGNER" = "$EXPECTED_SIGNER"
          echo "SIGNING_KEY_MATCH=PASS"

          tmpdir="$RUNNER_TEMP/part-sync-step7-filter-acceptance"
          rm -rf "$tmpdir"
          mkdir -p "$tmpdir"
          chmod 700 "$tmpdir"
          trap 'rm -rf "$tmpdir"' EXIT

          python3 - "$tmpdir/dry.json" <<'PY'
          import json, sys

          days = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"]
          booking_days = {
              day: {
                  "enabled": day == "monday",
                  "start": "10:00" if day == "monday" else "",
                  "end": "12:00" if day == "monday" else "",
              }
              for day in days
          }
          schedule = [{
              "day": "monday",
              "start": "10:00",
              "end": "12:00",
              "duration": 120,
              "capacity": 1,
          }]
          payload = {
              "operation": "create",
              "dry_run": True,
              "approved_company_id": 39,
              "product": {
                  "company_id": 39,
                  "name": "PART-SYNC Step 7 Filter Acceptance 2026-09-30",
                  "price": 1000.0,
                  "category_ids": [270],
                  "status": "H",
                  "short_description": "с 3 лет",
                  "full_description": "<p>Техническая Hidden-карточка dev_copy для acceptance Step 7.</p>",
                  "meta_keywords": "PART-SYNC Step 7 acceptance",
              },
              "booking": {
                  "from": "2026-09-30",
                  "to": "2027-09-30",
                  "slot_time": 120,
                  "free_time": 0,
                  "days": booking_days,
              },
              "capacity": 1,
              "variation_plan": [
                  {
                      "age_group": age_group,
                      "purchase_option": purchase_option,
                      "price": price,
                      "schedule": schedule,
                      "capacity": 1,
                  }
                  for age_group in ["3-5 лет", "6-9 лет"]
                  for purchase_option, price in [
                      ("Разовое занятие", 1000.0),
                      ("Абонемент 4 занятия", 3600.0),
                  ]
              ],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, separators=(",", ":"))
          print("PAYLOAD_BUILD=PASS")
          PY

          call_signed_apply() {
            request_id="$1"
            body_file="$2"
            out_file="$3"
            ts="$(date +%s)"
            body_hash="$(sha256sum "$body_file" | awk '{print $1}')"
            msg="$tmpdir/message"
            sig="$tmpdir/message.sig"
            printf 'talario-part-sync\napply\n%s\n%s\n%s\n' "$request_id" "$ts" "$body_hash" > "$msg"
            rm -f "$sig"
            ssh-keygen -Y sign -f ~/.ssh/id_ed25519 -n talario-part-sync "$msg" >/dev/null
            sig_b64="$(base64 -w0 "$sig")"
            curl --silent --show-error --request POST \
              'https://talario.ru/dev_copy/index.php?dispatch=talario_analytics.partner_apply' \
              -H 'Content-Type: application/json' \
              -H "X-Talario-Request-Id: $request_id" \
              -H "X-Talario-Timestamp: $ts" \
              -H "X-Talario-Signature: $sig_b64" \
              --data-binary "@$body_file" \
              --output "$out_file" \
              --write-out '%{http_code}'
          }

          dry_code="$(call_signed_apply 'part-sync-apply-step7-filter-dry-20260930-v2' "$tmpdir/dry.json" "$tmpdir/dry.out")"
          echo "DRY_HTTP=$dry_code"
          test "$dry_code" = "200"

          python3 - "$tmpdir/dry.out" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          plan=d.get("plan") or {}
          ff=plan.get("filter_features") or {}
          variations=plan.get("variations") or {}
          expected_ages=[3,4,5,6,7,8,9]
          if d.get("schema_version") != "partner-sync.write-plan.v1" or d.get("dry_run") is not True:
              raise SystemExit("dry-run schema mismatch")
          if ff.get("ages") != expected_ages:
              raise SystemExit("dry-run age filter mismatch")
          if ff.get("category") != "Ранее развитие":
              raise SystemExit("dry-run category filter mismatch")
          if variations.get("resolved") is not True or int(variations.get("count") or 0) != 4:
              raise SystemExit("dry-run variation resolution mismatch")
          print("DRY_RUN=PASS")
          print("FILTER_AGES=3,4,5,6,7,8,9")
          print("FILTER_CATEGORY=Ранее развитие")
          print("VARIATIONS=4")
          PY

          python3 - "$tmpdir/dry.json" "$tmpdir/create.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          p["dry_run"]=False
          p["approval_id"]="part-sync-step7-filter-accept-20260930-v2"
          with open(sys.argv[2],"w",encoding="utf-8") as fh:
              json.dump(p,fh,ensure_ascii=False,separators=(",",":"))
          PY

          create_code="$(call_signed_apply 'part-sync-apply-step7-filter-create-20260930-v2' "$tmpdir/create.json" "$tmpdir/create.out")"
          echo "CREATE_HTTP=$create_code"
          test "$create_code" = "201"

          python3 - "$tmpdir/create.out" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          rb=d.get("readback") or {}
          ff=rb.get("filter_features") or {}
          variations=d.get("variations") or {}
          expected_ages=[3,4,5,6,7,8,9]
          if d.get("schema_version") != "partner-sync.write-result.v1" or d.get("operation") != "create":
              raise SystemExit("create schema mismatch")
          if rb.get("status") != "H":
              raise SystemExit("created product is not Hidden")
          if ff.get("ages") != expected_ages:
              raise SystemExit("create age filter readback mismatch")
          if ff.get("category") != "Ранее развитие":
              raise SystemExit("create category filter readback mismatch")
          if int(variations.get("count") or 0) != 4:
              raise SystemExit("create variation count mismatch")
          product_id=int(d.get("product_id") or 0)
          if product_id <= 0:
              raise SystemExit("missing product id")
          print("CREATE=PASS")
          print("PRODUCT_ID="+str(product_id))
          print("STATUS=H")
          print("FILTER_AGES=3,4,5,6,7,8,9")
          print("FILTER_CATEGORY=Ранее развитие")
          print("VARIATIONS=4")
          print("VARIATION_FILTER_COPY=PASS")
          PY
