name: Deploy development to dev_copy

on:
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure pinned SSH host key
        shell: bash
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$BEGET_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$BEGET_SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' 'salvage.beget.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIs+AhzkOHDQ3wgwojXvZgnfyrnRuRgf83iUmCZJtKhY' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy development
        shell: bash
        env:
          # Explicitly step-scoped; must match the pinned known_hosts entry below.
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -euo pipefail
          BEGET_HOST="salvage.beget.com"

          set +e
          OUTPUT="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" talario-dev-deploy)"
          SSH_RC=$?
          set -e

          if [ "$SSH_RC" -ne 0 ]; then
            echo "REMOTE_DEPLOY_FAILED rc=$SSH_RC"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" "talario-dev-ops status" 2>/dev/null \
              | grep -E '^(DISPATCHER=talario-dev-github-v1|OPERATION=status|BRANCH=development|HEAD=[0-9a-f]{40}|WORKTREE=(CLEAN|DIRTY)|PHP=[0-9.]+|DEV_COPY_FLAG=(PRESENT|MISSING)|PARTNER_SYNC_HASH=(PRESENT|MISSING))$' \
              || true
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" "talario-dev-ops git-status" 2>/dev/null \
              | grep -E '^(DISPATCHER=talario-dev-github-v1|OPERATION=git-status|HEAD=[0-9a-f]{40}|DIRTY_COUNT=[0-9]+)$' \
              || true
            exit "$SSH_RC"
          fi

          DISPATCHER_LINE="$(printf '%s\n' "$OUTPUT" | grep -F -x 'DISPATCHER=talario-dev-github-v1')"
          DEPLOY_LINE="$(printf '%s\n' "$OUTPUT" | grep -E '^DEPLOY_OK [[:xdigit:]]+$')"

          test "$DISPATCHER_LINE" = "DISPATCHER=talario-dev-github-v1"
          test -n "$DEPLOY_LINE"

          printf '%s\n' "$DISPATCHER_LINE"
          printf '%s\n' "$DEPLOY_LINE"
