name: PART-SYNC PROD Create

on:
  push:
    branches: [prod]
    paths:
      - '.github/part-sync/prod-requests/*.json'

permissions:
  contents: read

concurrency:
  group: partner-sync-prod-create
  cancel-in-progress: false

jobs:
  create-card:
    if: github.repository == 'vasilpo/Talario' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PROD request
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exactly one request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" -- '.github/part-sync/prod-requests/*.json')
          [ "${#changed[@]}" -eq 1 ] || { echo "expected exactly one PROD Partner Sync request change" >&2; exit 64; }
          request="${changed[0]}"
          [[ "$request" =~ ^\.github/part-sync/prod-requests/[A-Za-z0-9._-]+\.json$ ]]
          test -f "$request"
          echo "request_file=$request" >> "$GITHUB_OUTPUT"

      - name: Configure reviewed signing key
        shell: bash
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${BEGET_SSH_KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$BEGET_SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          derived="$(ssh-keygen -y -f ~/.ssh/id_ed25519)"
          algorithm="$(awk '{print $1}' <<<"$derived")"
          public_key="$(awk '{print $2}' <<<"$derived")"
          test "$algorithm" = 'ssh-ed25519'
          manifest='app/addons/talario_analytics/config/partner_sync_signers.json'
          matches="$(jq --arg a "$algorithm" --arg k "$public_key" '[.signers[] | select(.algorithm==$a and .public_key==$k and (.status=="active" or .status=="next"))] | length' "$manifest")"
          test "$matches" = '1'
          echo 'PROD_SIGNER_MANIFEST_MATCH=PASS'

      - name: Signed bounded PROD create
        shell: bash
        env:
          PARTNER_SYNC_KEY_FILE: /home/runner/.ssh/id_ed25519
        run: |
          set -euo pipefail
          bash .github/part-sync/run-prod-create.sh "${{ steps.request.outputs.request_file }}" "${GITHUB_RUN_ATTEMPT}"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-sync-prod-create-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/partner-sync-prod-create-evidence/summary.txt
            ${{ runner.temp }}/partner-sync-prod-create-evidence/create-result.json
          retention-days: 14
          if-no-files-found: ignore
