name: Dev Copy Ops

on:
  push:
    branches:
      - development
    paths:
      - .github/dev-copy-ops/request.json
  workflow_dispatch:
    inputs:
      operation:
        description: Allowlisted read-only dev_copy operation
        required: true
        type: choice
        options:
          - status
          - git-status
          - php-lint
      request_id:
        description: Auditable request identifier
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: dev-copy-ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout request
        uses: actions/checkout@v4

      - name: Validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OP="${{ inputs.operation }}"
            REQUEST_ID="${{ inputs.request_id }}"
          else
            REQUEST=".github/dev-copy-ops/request.json"
            OP="$(jq -er '.operation' "$REQUEST")"
            REQUEST_ID="$(jq -er '.request_id' "$REQUEST")"
            jq -e 'keys | sort == ["operation","request_id"]' "$REQUEST" >/dev/null
          fi
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._:-]{1,80}$ ]]
          case "$OP" in
            status|git-status|php-lint)
              ;;
            *)
              echo "ERROR: operation is not allowlisted: $OP"
              exit 64
              ;;
          esac
          echo "operation=$OP" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH host key
        shell: bash
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$BEGET_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$BEGET_SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' 'salvage.beget.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIs+AhzkOHDQ3wgwojXvZgnfyrnRuRgf83iUmCZJtKhY' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run allowlisted dev_copy operation
        id: remote
        shell: bash
        env:
          BEGET_USER: ${{ secrets.BEGET_USER }}
          OPERATION: ${{ steps.request.outputs.operation }}
        run: |
          set -euo pipefail
          BEGET_HOST="salvage.beget.com"

          set +e
          RAW_OUTPUT="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" "talario-dev-ops $OPERATION" 2>&1)"
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            CLEAN_OUTPUT="$(printf '%s\n' "$RAW_OUTPUT" | grep -E '^(DISPATCHER|OPERATION|BRANCH|HEAD|WORKTREE|PHP|DEV_COPY_FLAG|PARTNER_SYNC_HASH|DIRTY_COUNT|PHP_LINT)=' | head -20)"
            printf '%s\n' "$CLEAN_OUTPUT" | grep -qx 'DISPATCHER=talario-dev-github-v1'
          else
            CLEAN_OUTPUT="REMOTE_OPERATION_FAILED rc=$RC"
          fi

          {
            echo "rc=$RC"
            echo 'output<<EOF'
            printf '%s\n' "$CLEAN_OUTPUT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Record sanitized result
        if: always()
        uses: actions/github-script@v7
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          OPERATION: ${{ steps.request.outputs.operation }}
          RC: ${{ steps.remote.outputs.rc }}
          RESULT: ${{ steps.remote.outputs.output }}
        with:
          script: |
            const body = [
              '## Dev Copy Ops result',
              '',
              'request: `' + (process.env.REQUEST_ID || 'unknown') + '`',
              'operation: `' + (process.env.OPERATION || 'unknown') + '`',
              'remote_rc: `' + (process.env.RC || 'unknown') + '`',
              '',
              '```text',
              process.env.RESULT || 'workflow failed before sanitized output',
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 204,
              body,
            });
