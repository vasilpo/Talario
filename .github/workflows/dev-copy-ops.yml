name: Dev Copy Ops

on:
  push:
    branches:
      - development
    paths:
      - .github/dev-copy-ops/request.json
  workflow_dispatch:
    inputs:
      operation:
        description: Allowlisted dev_copy operation
        required: true
        type: choice
        options:
          - status
          - git-status
          - php-lint
          - partner-sync-dry-run
      request_id:
        description: Auditable request identifier
        required: true
        type: string
      payload_b64:
        description: Base64 JSON payload for Partner Sync dry-run only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dev-copy-ops
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_dispatch' || github.actor == 'vasilpo'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout request
        uses: actions/checkout@v4

      - name: Validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OP="${{ inputs.operation }}"
            REQUEST_ID="${{ inputs.request_id }}"
            PAYLOAD_B64="${{ inputs.payload_b64 }}"
          else
            REQUEST=".github/dev-copy-ops/request.json"
            OP="$(jq -er '.operation' "$REQUEST")"
            REQUEST_ID="$(jq -er '.request_id' "$REQUEST")"
            jq -e 'keys | sort == ["operation","request_id"]' "$REQUEST" >/dev/null
            PAYLOAD_B64=
          fi
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._:-]{1,80}$ ]]
          case "$OP" in
            status|git-status|php-lint)
              ;;
            partner-sync-dry-run)
              [ "${{ github.event_name }}" = "workflow_dispatch" ] || {
                echo "ERROR: partner-sync-dry-run requires workflow_dispatch"
                exit 64
              }
              [ -n "${PAYLOAD_B64:-}" ] || {
                echo "ERROR: partner-sync-dry-run payload is required"
                exit 64
              }
              ;;
            *)
              echo "ERROR: operation is not allowlisted: $OP"
              exit 64
              ;;
          esac
          echo "operation=$OP" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          if [ "$OP" = "partner-sync-dry-run" ]; then
            PAYLOAD_FILE="$RUNNER_TEMP/partner-sync-payload.json"
            printf '%s' "$PAYLOAD_B64" | base64 --decode > "$PAYLOAD_FILE"
            [ -s "$PAYLOAD_FILE" ]
            [ "$(wc -c < "$PAYLOAD_FILE" | tr -d ' ')" -le 262144 ]
            jq -e 'type == "object" and .dry_run == true' "$PAYLOAD_FILE" >/dev/null
            echo "payload_file=$PAYLOAD_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure pinned SSH host key
        shell: bash
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$BEGET_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$BEGET_SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' 'salvage.beget.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIs+AhzkOHDQ3wgwojXvZgnfyrnRuRgf83iUmCZJtKhY' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run allowlisted dev_copy operation
        id: remote
        shell: bash
        env:
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -euo pipefail
          BEGET_HOST="salvage.beget.com"
          case "${{ steps.request.outputs.operation }}" in
            status)
              REMOTE_COMMAND='talario-dev-ops status'
              ;;
            git-status)
              REMOTE_COMMAND='talario-dev-ops git-status'
              ;;
            php-lint)
              REMOTE_COMMAND='talario-dev-ops php-lint'
              ;;
            partner-sync-dry-run)
              REMOTE_COMMAND='talario-partner-sync-dry-run'
              ;;
            *)
              echo "ERROR: operation is not allowlisted"
              exit 64
              ;;
          esac

          set +e
          if [ "${{ steps.request.outputs.operation }}" = "partner-sync-dry-run" ]; then
            RAW_OUTPUT="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" "$REMOTE_COMMAND" < "${{ steps.request.outputs.payload_file }}" 2>&1)"
          else
            RAW_OUTPUT="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" "$REMOTE_COMMAND" 2>&1)"
          fi
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            if [ "${{ steps.request.outputs.operation }}" = "partner-sync-dry-run" ]; then
              MARKERS="$(printf '%s\n' "$RAW_OUTPUT" | grep -E '^(DISPATCHER=talario-dev-github-v1|OPERATION=partner-sync-dry-run)$' | head -4)"
              PLAN="$(printf '%s\n' "$RAW_OUTPUT" | tail -1 | jq -cer '{schema_version, dry_run, operation: .plan.operation, company_id: .plan.product.company_id, category_count: (.plan.product.category_ids | length), image_count: (if .plan.images == null then 0 else .plan.images.count end), variations_resolved: (if .plan.variations == null then null else .plan.variations.resolved end)}')"
              CLEAN_OUTPUT="$(printf '%s\n%s\n' "$MARKERS" "$PLAN")"
            else
              CLEAN_OUTPUT="$(printf '%s\n' "$RAW_OUTPUT" | grep -E '^(DISPATCHER=talario-dev-github-v1|OPERATION=(status|git-status|php-lint)|BRANCH=development|HEAD=[0-9a-f]{40}|WORKTREE=(CLEAN|DIRTY)|PHP=[0-9]+\.[0-9]+\.[0-9]+|DEV_COPY_FLAG=(PRESENT|MISSING)|DIRTY_COUNT=[0-9]+|PHP_LINT=OK)$' | head -20)"
            fi
            printf '%s\n' "$CLEAN_OUTPUT" | grep -qx 'DISPATCHER=talario-dev-github-v1'
          else
            CLEAN_OUTPUT="REMOTE_OPERATION_FAILED rc=$RC"
          fi

          printf '%s\n' "$CLEAN_OUTPUT"

          DELIM="TALARIO_DEV_OPS_OUTPUT"
          {
            echo "rc=$RC"
            echo "output<<$DELIM"
            printf '%s\n' "$CLEAN_OUTPUT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          if [ "$RC" -ne 0 ]; then
            exit "$RC"
          fi
