name: PART-SYNC visual acceptance probe
on:
  pull_request:
    branches: [development]
    paths: [.github/workflows/part-sync-visual-acceptance.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose dev_copy storefront card 1158
        shell: python
        run: |
          import html, re, urllib.request, urllib.error
          url = "https://talario.ru/dev_copy/index.php?dispatch=products.view&product_id=1158"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          req = urllib.request.Request(url, headers={"User-Agent": "Talario-Visual-Acceptance/1.0"})
          opener = urllib.request.build_opener(NoRedirect)
          try:
              r = opener.open(req, timeout=30)
          except urllib.error.HTTPError as e:
              r = e
          body = r.read().decode("utf-8", "replace")
          def clean(s):
              s = re.sub(r"<script[\\s\\S]*?</script>", " ", s, flags=re.I)
              s = re.sub(r"<style[\\s\\S]*?</style>", " ", s, flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s)
              return re.sub(r"\\s+", " ", html.unescape(s)).strip()
          print("HTTP_STATUS=", r.status)
          print("URL=", r.geturl())
          print("LOCATION=", r.headers.get("Location", ""))
          print("BODY_TEXT=", clean(body)[:4000])
          assert r.status in (200, 301, 302, 303, 307, 308)
