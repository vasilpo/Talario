name: PART-SYNC visual acceptance probe
on:
  pull_request:
    branches: [development]
    paths: [.github/workflows/part-sync-visual-acceptance.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe dev_copy storefront card 1158
        shell: python
        run: |
          import html, re, urllib.request
          url = "https://talario.ru/dev_copy/index.php?dispatch=products.view&product_id=1158"
          req = urllib.request.Request(url, headers={"User-Agent": "Talario-Visual-Acceptance/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode("utf-8", "replace"); final = r.geturl(); status = r.status
          def clean(s):
              s = re.sub(r"<script[\\s\\S]*?</script>", " ", s, flags=re.I)
              s = re.sub(r"<style[\\s\\S]*?</style>", " ", s, flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s); s = html.unescape(s)
              return re.sub(r"\\s+", " ", s).strip()
          title_m = re.search(r"<title[^>]*>([\\s\\S]*?)</title>", body, re.I)
          h1_m = re.search(r"<h1[^>]*>([\\s\\S]*?)</h1>", body, re.I)
          text = clean(body); imgs = re.findall(r"<img\\b[^>]*>", body, re.I)
          print("HTTP_STATUS=", status); print("FINAL_URL=", final)
          print("TITLE=", clean(title_m.group(1))[:300] if title_m else "")
          print("H1=", clean(h1_m.group(1))[:300] if h1_m else "")
          print("IMG_COUNT=", len(imgs)); print("BODY_TEXT=", text[:5000])
          assert status in (200, 301, 302, 303, 307, 308)
          assert not re.search(r"(страница не найдена|товар не найден|fatal error|uncaught exception)", text, re.I)
