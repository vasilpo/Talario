name: PART-SYNC visual acceptance probe
on:
  pull_request:
    branches: [development]
    paths: [.github/workflows/part-sync-visual-acceptance.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe canonical dev_copy card 1158
        shell: python
        run: |
          import html, re, urllib.request, urllib.error
          url = "https://talario.ru/dev_copy/rannee-razvitie/akademiya-intellekta-detskiy-centr-penaty-krasnogorsk-ru-13/"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 Talario-Visual-Acceptance/1.0"})
          try:
              r = urllib.request.urlopen(req, timeout=30)
          except urllib.error.HTTPError as e:
              r = e
          body = r.read().decode("utf-8", "replace")
          def clean(s):
              s = re.sub(r"<script[\\s\\S]*?</script>", " ", s, flags=re.I)
              s = re.sub(r"<style[\\s\\S]*?</style>", " ", s, flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s)
              return re.sub(r"\\s+", " ", html.unescape(s)).strip()
          text = clean(body)
          title = re.search(r"<title[^>]*>([\\s\\S]*?)</title>", body, re.I)
          h1 = re.search(r"<h1[^>]*>([\\s\\S]*?)</h1>", body, re.I)
          print("HTTP_STATUS=", r.status); print("FINAL_URL=", r.geturl())
          print("TITLE=", clean(title.group(1))[:300] if title else "")
          print("H1=", clean(h1.group(1))[:300] if h1 else "")
          print("IMG_COUNT=", len(re.findall(r"<img\\b", body, re.I)))
          print("BODY_TEXT=", text[:6000])
          assert r.status == 200
          assert "Пенаты" in text
          assert len(re.findall(r"<img\\b", body, re.I)) > 0
          assert not re.search(r"(страница не найдена|товар не найден|fatal error|uncaught exception)", text, re.I)
