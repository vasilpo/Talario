name: B1 Analytics PROD Hash Sync

on:
  push:
    branches:
      - ops/b1-analytics-prod-hash-run

permissions:
  contents: read

jobs:
  sync:
    if: github.actor == github.repository_owner && contains(github.event.head_commit.message, '[B1-ANALYTICS-PROD-HASH]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PROD_SHA: 2dea53c94eecc33d84980bab1b808a35258e03f7
      ANALYTICS_TOKEN_SHA256: d0c89474d66be2bfe41688922b90a579bf2962324f246ef644331889668be06f

    steps:
      - name: Configure pinned Beget SSH
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BEGET_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$BEGET_SSH_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          echo 'salvage.beget.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIs+AhzkOHDQ3wgwojXvZgnfyrnRuRgf83iUmCZJtKhY' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Exact deploy and sync hash
        env:
          BEGET_USER: ${{ secrets.BEGET_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BEGET_USER"
          ssh -o BatchMode=yes -o PasswordAuthentication=no -o StrictHostKeyChecking=yes             "$BEGET_USER@salvage.beget.com"             "EXPECTED_PROD_SHA='$EXPECTED_PROD_SHA' ANALYTICS_TOKEN_SHA256='$ANALYTICS_TOKEN_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          ROOT="/home/t/tyman5tb/talario.ru/public_html"
          cd "$ROOT"
          git fetch --quiet https://github.com/vasilpo/Talario.git prod
          target="$(git rev-parse FETCH_HEAD)"
          [ "$target" = "$EXPECTED_PROD_SHA" ] || {
            echo "ERROR: unexpected prod target"
            exit 64
          }

          deploy="$HOME/.talario-b1-prod-deploy.sh"
          git show "$target:ops/deploy-prod.sh" > "$deploy"
          chmod 700 "$deploy"
          trap 'rm -f "$deploy"' EXIT
          TALARIO_CONFIRM_PROD_DEPLOY="$target" bash "$deploy" deploy
          [ "$(git rev-parse HEAD)" = "$EXPECTED_PROD_SHA" ]
          echo "PROD_EXACT_SHA=PASS"

          bash ops/beget/sync-analytics-prod-hash.sh "$ANALYTICS_TOKEN_SHA256"
          echo "ANALYTICS_HASH_SYNC=PASS"

          curl -fsS --max-time 20 https://talario.ru/ >/tmp/talario-b1-health.html
          grep -qi 'Talario' /tmp/talario-b1-health.html
          rm -f /tmp/talario-b1-health.html
          echo "STOREFRONT_HEALTH=PASS"
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
