name: PART-SYNC Step 6 Description Fix

on:
  push:
    branches: [development]
    paths:
      - '.github/part-sync/step6-description-fix.request'

permissions:
  contents: read

jobs:
  fix-description-once:
    if: github.repository == 'vasilpo/Talario' && github.actor == 'vasilpo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply exact pinned description to fixed Step 6 variation group
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://talario.ru/dev_copy/index.php?dispatch=talario_analytics.partner_step6_fix_description'
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 60 \
            -X POST "$endpoint" \
            -H 'Content-Type: application/json' \
            --data '{"action":"step6-fix-description-v1"}')
          echo "STEP6_DESCRIPTION_FIX_HTTP=$code"
          test "$code" = 200
          jq -e '.pass == true and (.updated_count == 15 or .already_fixed == true) and .product_count == 15 and .group_id == 145' out.json >/dev/null
          jq '{pass,already_fixed,updated_count,group_id,product_count,after_sha256}' out.json
