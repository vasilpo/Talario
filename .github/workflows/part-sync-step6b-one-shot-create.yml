name: PART-SYNC Step 6B Glinyanye Chudesa one-shot CREATE

on:
  push:
    branches:
      - part-sync/clay-safe-failure-diagnostics
    paths:
      - '.github/part-sync/step6-glina-create-v3.once.json'

permissions:
  contents: read

concurrency:
  group: part-sync-step6b-glina-create-once
  cancel-in-progress: false

jobs:
  create-once:
    if: github.repository == 'vasilpo/Talario' && github.actor == 'vasilpo' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate one-shot request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/part-sync/step6-glina-create-v3.once.json'
          test -f "$request"

          change="$(git diff --name-status HEAD^ HEAD -- "$request")"
          expected_change="$(printf 'A\t%s' "$request")"
          test "$change" = "$expected_change"

          python3 - "$request" <<'PY'
          import json, sys, urllib.parse
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if r.get('schema_version')!='talario.part-sync.step6b.request.v1':
              raise SystemExit('REQUEST_SCHEMA_INVALID')
          if r.get('request_id')!='part-sync-glina-step6-v3-20260928':
              raise SystemExit('REQUEST_ID_INVALID')
          if int(r.get('source_run_id',0))!=36476246274:
              raise SystemExit('SOURCE_RUN_INVALID')
          if int(r.get('artifact_id',0))!=10993567144:
              raise SystemExit('ARTIFACT_ID_INVALID')
          if r.get('artifact_zip_sha256')!='df84953e2b441d64daf89685a9a92c05b3084143dad4aaffcf3a762a7600f094':
              raise SystemExit('ARTIFACT_SHA_INVALID')
          if r.get('plaintext_sha256')!='0e4c0eeccb2ffac735d026f0962d5fdb4ca138aaafa21bf8a9273d60c60cac3c':
              raise SystemExit('PLAINTEXT_SHA_INVALID')
          if int(r.get('plaintext_bytes',0))!=2391697:
              raise SystemExit('PLAINTEXT_BYTES_INVALID')
          u=urllib.parse.urlparse(str(r.get('artifact_url','')))
          if u.scheme!='https' or not (u.hostname or '').endswith('.oaiusercontent.com'):
              raise SystemExit('ARTIFACT_URL_HOST_INVALID')
          if not u.path.endswith('/raw'):
              raise SystemExit('ARTIFACT_URL_PATH_INVALID')
          print('STEP6B_REQUEST=PASS')
          PY

      - name: Download and validate encrypted handoff
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          echo "WORK=$work" >> "$GITHUB_ENV"
          request='.github/part-sync/step6-glina-create-v3.once.json'
          url="$(jq -er '.artifact_url' "$request")"

          curl --fail --silent --show-error --max-time 90 --max-filesize 5242880             "$url" --output "$work/handoff.zip"

          actual_zip_sha="$(sha256sum "$work/handoff.zip" | awk '{print $1}')"
          expected_zip_sha="$(jq -er '.artifact_zip_sha256' "$request")"
          test "$actual_zip_sha" = "$expected_zip_sha"

          python3 - "$work/handoff.zip" "$work/envelope.json" <<'PY'
          import sys, zipfile
          src,dst=sys.argv[1:3]
          with zipfile.ZipFile(src) as z:
              infos=z.infolist()
              if len(infos)!=1 or infos[0].filename!='envelope.json':
                  raise SystemExit('ARTIFACT_CONTENT_INVALID')
              if infos[0].file_size<1000000 or infos[0].file_size>5000000:
                  raise SystemExit('ENVELOPE_SIZE_INVALID')
              data=z.read('envelope.json')
          open(dst,'wb').write(data)
          print('STEP6B_ARTIFACT=PASS')
          PY

          python3 - "$work/envelope.json" <<'PY'
          import json,sys
          e=json.load(open(sys.argv[1],encoding='utf-8'))
          expected={
              'target':'dev_copy','operation':'create','dry_run':False,'company_id':12,
              'category_id':268,'status':'H','variation_count':15,'image_count':3,
              'auto_retry':False,'expected_http':201,
          }
          if e.get('schema_version')!='talario.part-sync.encrypted-create.v1':
              raise SystemExit('ENVELOPE_SCHEMA_INVALID')
          if e.get('aad')!='talario-part-sync-step6-create-v1':
              raise SystemExit('ENVELOPE_AAD_INVALID')
          if e.get('plaintext_sha256')!='0e4c0eeccb2ffac735d026f0962d5fdb4ca138aaafa21bf8a9273d60c60cac3c':
              raise SystemExit('ENVELOPE_PLAINTEXT_SHA_INVALID')
          if int(e.get('plaintext_bytes',0))!=2391697:
              raise SystemExit('ENVELOPE_PLAINTEXT_BYTES_INVALID')
          if e.get('policy')!=expected:
              raise SystemExit('ENVELOPE_POLICY_INVALID')
          print('STEP6B_ENVELOPE=PASS')
          PY

      - name: Decrypt exact CREATE payload
        env:
          SIGNING_KEY: ${{ secrets.BEGET_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEY:-}"
          work="$WORK"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$work/signing_key"
          chmod 600 "$work/signing_key"
          actual_pub="$(ssh-keygen -y -f "$work/signing_key" | awk '{print $2}')"
          test "$actual_pub" = 'AAAAC3NzaC1lZDI1NTE5AAAAIA/89+6Q50ah8vHptYSd4T6GsrhW+mYwf/xpNyZyAdDP'

          node "$GITHUB_WORKSPACE/.github/part-sync/step6-decrypt.mjs"             "$work/signing_key" "$work/envelope.json" "$work/apply.json"

          test "$(wc -c < "$work/apply.json" | tr -d ' ')" = '2391697'
          test "$(sha256sum "$work/apply.json" | awk '{print $1}')" = '0e4c0eeccb2ffac735d026f0962d5fdb4ca138aaafa21bf8a9273d60c60cac3c'

          python3 - "$work/apply.json" <<'PY'
          import base64,hashlib,json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          if p.get('operation')!='create' or p.get('dry_run') is not False:
              raise SystemExit('CREATE_POLICY_INVALID')
          if p.get('approval_id')!='part-sync-glinyanye-chudesa-20260928-step6':
              raise SystemExit('APPROVAL_ID_INVALID')
          if int(p.get('approved_company_id',0))!=12 or p.get('bootstrap_missing_age_variants') is not True:
              raise SystemExit('COMPANY_OR_BOOTSTRAP_INVALID')
          product=p.get('product') or {}
          if int(product.get('company_id',0))!=12 or product.get('status')!='H':
              raise SystemExit('PRODUCT_SCOPE_INVALID')
          if product.get('name')!='Первая кржука' or product.get('category_ids')!=[268] or int(product.get('price',0))!=1500:
              raise SystemExit('PRODUCT_IDENTITY_INVALID')
          if '<iframe' in str(product.get('full_description','')) or 'map-widget' in str(product.get('full_description','')):
              raise SystemExit('UNVERIFIED_MAP_FORBIDDEN')
          variations=p.get('variation_plan') or []
          if len(variations)!=15:
              raise SystemExit('VARIATION_COUNT_INVALID')
          if sorted({int(v['price']) for v in variations}) != [0,1500,3600,6800,9600]:
              raise SystemExit('PRICE_SET_INVALID')
          if sorted({int(v['capacity']) for v in variations}) != [5]:
              raise SystemExit('CAPACITY_INVALID')
          if sorted({int(s['duration']) for v in variations for s in v['schedule']}) != [60]:
              raise SystemExit('DURATION_INVALID')
          expected=[
              ('1lTISmlz74-JAMCOLST9GFD93gXUPNhYg',1333492,'2bc3bebea638a37b5550a7e366e40c1e00c403d95988331bed2c9156c36b5f49'),
              ('1lrG4Y9JPyFcA-BF02s6_7MPQxVo4XLij',393816,'5b1b957d211b22a6b6ef201899daedeb973bb9e3bec0649dd8dbd89cb3d44fb9'),
              ('1Xv1qQNhMWU2i2pBBWFIG1OCIOoh_IUA0',60168,'ea95cc2758b3185bd8ab24717494f9378c45c46024b510faaced1d21c17b3b21'),
          ]
          images=p.get('images') or []
          if len(images)!=3:
              raise SystemExit('IMAGE_COUNT_INVALID')
          for image,(drive_id,size,sha) in zip(images,expected):
              raw=base64.b64decode(image['content_base64'],validate=True)
              if image.get('source_drive_id')!=drive_id or int(image.get('source_bytes',0))!=size or image.get('source_sha256')!=sha:
                  raise SystemExit('IMAGE_METADATA_INVALID')
              if len(raw)!=size or hashlib.sha256(raw).hexdigest()!=sha:
                  raise SystemExit('IMAGE_BYTES_INVALID')
          print('STEP6B_PAYLOAD=PASS')
          PY

      - name: One signed CREATE and machine readback
        env:
          SIGNING_KEY: ${{ secrets.BEGET_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          work="$WORK"
          endpoint='https://talario.ru/dev_copy/index.php?dispatch=talario_analytics.partner_apply'
          req_id="part-sync-apply-glina-step6-${GITHUB_RUN_ID}"
          ts="$(date +%s)"
          body_hash="$(sha256sum "$work/apply.json" | awk '{print $1}')"
          printf 'talario-part-sync\napply\n%s\n%s\n%s\n' "$req_id" "$ts" "$body_hash" > "$work/message"
          ssh-keygen -Y sign -q -f "$work/signing_key" -n talario-part-sync "$work/message"
          sig="$(base64 < "$work/message.sig" | tr -d '\n')"

          code="$(curl --silent --show-error --output "$work/apply.out" --write-out '%{http_code}' --max-time 180             -X POST "$endpoint"             -H 'Content-Type: application/json'             -H "X-Talario-Request-Id: $req_id"             -H "X-Talario-Timestamp: $ts"             -H "X-Talario-Signature: $sig"             --data-binary "@$work/apply.json")"

          echo "STEP6B_HTTP=$code"
          if [ "$code" != '201' ]; then
            jq -c '{error:(.error//"unexpected_response"),detail:(.detail//null),runner_rc:(.runner_rc//null)}' "$work/apply.out" 2>/dev/null || true
            echo 'STEP6B_CREATE=STOP_NO_RETRY'
            exit 60
          fi

          python3 - "$work/apply.json" "$work/apply.out" <<'PY'
          import json,sys
          expected=json.load(open(sys.argv[1],encoding='utf-8'))
          d=json.load(open(sys.argv[2],encoding='utf-8'))
          if d.get('schema_version')!='partner-sync.write-result.v1' or d.get('dry_run') is not False:
              raise SystemExit('READBACK_SCHEMA_INVALID')
          if d.get('operation')!='create' or int(d.get('product_id') or 0)<=0:
              raise SystemExit('READBACK_OPERATION_INVALID')
          rb=d.get('readback') or {}
          checks={
              'company_id':int(rb.get('company_id') or 0)==12,
              'name':rb.get('name')=='Первая кржука',
              'status':rb.get('status')=='H',
              'price':float(rb.get('price') or 0)==1500.0,
              'description':rb.get('full_description')==expected['product']['full_description'],
              'images_main':int((rb.get('images') or {}).get('main') or 0)==1,
              'images_additional':int((rb.get('images') or {}).get('additional') or 0)==2,
              'slot_time':int((rb.get('booking') or {}).get('slot_time') or 0)==60,
              'variations':int((d.get('variations') or {}).get('count') or 0)==15,
          }
          items=(d.get('variations') or {}).get('items') or []
          checks['variation_items']=len(items)==15
          checks['price_set']=sorted({int(round(float(x['price']))) for x in items})==[0,1500,3600,6800,9600]
          checks['duration']=sorted({int(x['duration']) for x in items})==[60]
          checks['capacity']=sorted({int(s['capacity']) for x in items for s in (x.get('schedule') or [])})==[5]
          failed=[k for k,v in checks.items() if not v]
          if failed:
              print('STEP6B_READBACK_FAILED='+','.join(failed))
              raise SystemExit(1)
          print('STEP6B_CREATE=PASS')
          print('STEP6B_PRODUCT_ID='+str(d['product_id']))
          print('STEP6B_READBACK_STATUS=H')
          print('STEP6B_READBACK_IMAGES=1+2')
          print('STEP6B_READBACK_VARIATIONS=15')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "${WORK:-}" /tmp/step6-*
