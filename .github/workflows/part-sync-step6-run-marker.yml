name: PART-SYNC Step 6 run marker

on:
  push:
    branches:
      - development
    paths:
      - '.github/part-sync/step6-create.request.json'

permissions:
  contents: read
  statuses: write

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish run id as commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'part-sync/step6-run',
              description: 'Step 6 run ' + context.runId,
              target_url: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
            });
