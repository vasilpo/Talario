<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UX-01 confirmation geometry regression</title>
<style>
body{margin:20px;font:14px/1.4 system-ui;background:#f5f5f5;color:#222}
button{padding:9px 16px}#result{white-space:pre-wrap;background:#fff;padding:14px}
#frames{display:flex;flex-wrap:wrap;gap:20px}article{max-width:100%;overflow:auto}
iframe{display:block;border:0;background:#fff}h2{font-size:16px}
</style>
<h1>UX-01: доступность подтверждения фильтра</h1>
<p>CSS geometry regression с текущими стилями dev_copy и реальным observer.
Это fixture, а не приёмка настоящего телефона. Вход: тестовая админка → Витрина.</p>
<button id="check" type="button">Проверить геометрию</button>
<pre id="result" aria-live="polite">Загрузка CSS…</pre>
<div id="frames"></div>
<script>
'use strict';
const VERSION='20261028-native-bottom';
const cases=[
  {id:'mobile-age-native',w:390,h:844,native:true},
  {id:'mobile-age-preview-native',w:390,h:844,native:true,preview:true},
  {id:'mobile-direction-native',w:390,h:844,native:true,direction:true},
  {id:'mobile-direction-klaro-native',w:390,h:844,native:true,direction:true,consent:110},
  {id:'mobile-age-klaro-native',w:390,h:844,native:true,consent:110},
  {id:'mobile-no-native',w:390,h:844},
  {id:'desktop-done',w:1440,h:900,desktop:true}
];
let frames=[],sourceInfo;
const escapeAttr=value=>String(value).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;');
function popup(c){
  const id=c.direction?'316':'322',title=c.direction?'Направление':'Возраст';
  const labels=c.direction?['Спорт','Творчество','Танцы','Раннее развитие','Музыка','Программирование','Робототехника','Школьные предметы','Языки','Интеллектуальные занятия','Детские лагеря']:['2 года','3 года','4 года'];
  const list=`<div class="ty-product-filters__item-more"><ul class="ty-product-filters__variants ${c.direction?'':'ux01-age-native'}">${labels.map((label,i)=>`<li class="lr-homepage-search-filters__variant ty-product-filters__group ut2-product-filters__variant"><input type="checkbox" id="option-${i}" class="cm-lr-homepage-search-filter"><label for="option-${i}"><span><span class="ut2-product-filters__variant__prefix"></span><span class="ut2-product-filters__variant__value">${label}</span><span class="ut2-product-filters__variant__suffix"></span></span></label></li>`).join('')}</ul></div>`;
  const range=c.direction?'':`<div class="ux01-age-range"><p class="ux01-age-tip">Выбери возрастной диапазон</p><div class="ux01-age-selects"><label class="ux01-age-field">От<select aria-label="Возраст от"><option>2 года</option></select></label><label class="ux01-age-field">До<select aria-label="Возраст до"><option>4 года</option></select></label></div></div>`;
  const content=list.replace('<ul',range+'<ul');
  return `<div id="elm_filter_239_${id}" class="cm-popup-box ty-horizontal-product-filters-dropdown__content cm-horizontal-filters-content js_open container-opened"><div class="ty-horizontal-product-filters-dropdown__title"><span>${title}</span><div class="ut2-btn-close cm-external-click">×</div></div>${content}<div class="ux01-panel-actions"><button type="button" class="ux01-action-done">Готово</button><button type="button" class="ux01-action-mobile">Показать занятия</button></div></div>`;
}
function fixture(c,styles,inline,coordinator){
  const flags=['talario-ux01-active',c.desktop?'':'no-scroll',c.native?'js_sticky-bottom-panel_-exists':'',c.preview?'bp-panel-active':''].join(' ');
  const bar=c.native?`<div class="ut2-sticky-panel__wrap"><div class="ut2-sticky-panel">${['Каталог','Поиск','Избранное','Корзина','Профиль'].map(label=>`<div class="ut2-sticky-panel__item"><a href="#" class="ut2-sticky-panel__link"><i>○</i><span>${label}</span></a></div>`).join('')}</div></div>`:'';
  return `<!doctype html><html class="${flags}"><head><meta charset="utf-8">${styles.map(url=>`<link rel="stylesheet" href="${escapeAttr(url)}">`).join('')}<style>${inline.replace(/<\/style/gi,'<\\/style')}.fixture-consent{position:fixed;bottom:0;left:0;right:0;height:${c.consent||0}px;z-index:100000;background:#333;color:white;padding:12px;box-sizing:border-box}</style></head><body class="${c.desktop?'desktop-screen':'mobile-screen'}"><section id="talario-ux01" class="talario-ux01"><main class="talario-ux01__main"><h1>Занятия для детей</h1><div class="query-inner wrap"><div class="quick"><div class="ty-horizontal-product-filters cm-lr-homepage-search-filters cm-horizontal-filters ut2-scroll-container ut2-filters"><div class="ty-product-filters__wrapper ut2-scroll-content filter-strip"><div class="ut2__horizontal-product-filters-dropdown ut2-scroll-item ux01-quick-control ut2-horizontal-product-filters-dropdown"><div id="sw_elm_filter_239_${c.direction?'316':'322'}" class="ty-horizontal-product-filters-dropdown__wrapper quick-button cm-combination open ${c.desktop?'':'cm-abt--ut2-toggle-scroll'}"><span class="ux01-quick-label">${c.direction?'Направление':'Возраст'}</span></div>${c.desktop?popup(c):''}</div></div>${c.desktop?'':popup(c)}</div></div></div></main></section>${bar}${c.preview?'<div id="bp_bottom_panel" class="bp-panel bp-panel--store bp-panel--customer">Native preview toolbar</div>':''}${c.consent?'<div id="klaro"><div class="cookie-notice fixture-consent">Klaro notice fixture</div></div>':''}<script>var module={exports:{}};<\/script><script src="${escapeAttr(coordinator)}"><\/script><script>if(typeof module.exports.installBottomInsetObserver==='function'){module.exports.installBottomInsetObserver(window,document);}else{document.body.dataset.observerError='observer export unavailable';}<\/script></body></html>`;
}
async function setup(){
  // No local file reads or credential/session access. Source is an already
  // authorized storefront on the same dev_copy origin; PROD never loads it.
  if(!/^\/dev_copy\/tests\/ux01\//.test(location.pathname))throw Error('dev_copy test route required');
  const source=document.createElement('iframe');source.title='Source storefront styles';source.setAttribute('aria-hidden','true');source.style.cssText='position:absolute;left:-10000px;top:0;width:1440px;height:900px;visibility:hidden;pointer-events:none';
  const loaded=new Promise(resolve=>source.addEventListener('load',resolve,{once:true}));
  source.src='/dev_copy/';document.body.append(source);await loaded;
  const doc=source.contentDocument;
  if(!doc.querySelector('#talario-ux01'))throw Error('Authorized UX-01 storefront unavailable');
  const styles=[...doc.querySelectorAll('link[rel="stylesheet"][href]')].map(link=>new URL(link.href)).filter(url=>url.origin===location.origin&&url.pathname.startsWith('/dev_copy/')).map(url=>url.href);
  if(!styles.some(url=>url.includes('/standalone.')))throw Error('Compiled storefront CSS unavailable');
  const inline=[...doc.querySelectorAll('style')].map(style=>style.textContent).filter(css=>css.includes('bp-panel')).join('\n');
  // The shell may precede the asynchronous loader. Observe one bounded wait,
  // without treating a missing intermediate tag as a storefront defect.
  if(!doc.querySelector('script[data-ux01-filter-coordinator]'))await new Promise((resolve,reject)=>{
    const watcher=new MutationObserver(()=>{if(doc.querySelector('script[data-ux01-filter-coordinator]')){watcher.disconnect();clearTimeout(timer);resolve();}});
    const timer=setTimeout(()=>{watcher.disconnect();reject(Error('Coordinator loader did not become ready within 12s'));},12000);
    watcher.observe(doc.head,{childList:true,subtree:true});
    if(doc.querySelector('script[data-ux01-filter-coordinator]')){watcher.disconnect();clearTimeout(timer);resolve();}
  });
  const coordinator=new URL(doc.querySelector('script[data-ux01-filter-coordinator]')?.src||'',location.href);
  if(coordinator.origin!==location.origin||coordinator.pathname!=='/dev_copy/js/addons/lr_design_changes/ux01_search_coordinator.js'||coordinator.searchParams.get('v')!==VERSION)throw Error('Storefront coordinator cache version not upgraded');
  sourceInfo={styles,coordinator:coordinator.href};
  frames=cases.map(c=>{
    const article=document.createElement('article'),title=document.createElement('h2'),frame=document.createElement('iframe');
    title.textContent=`${c.id} · ${c.w}×${c.h}`;frame.title=c.id;frame.style.width=c.w+'px';frame.style.height=c.h+'px';
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.srcdoc=fixture(c,styles,inline,coordinator.href);article.append(title,frame);document.querySelector('#frames').append(article);
    return {c,frame,loaded};
  });
}
const ready=setup();
const rect=el=>{const r=el.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,height:r.height};};
const intersects=(a,b)=>Math.min(a.right,b.right)-Math.max(a.left,b.left)>0.5&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>0.5;
function inspect({c,frame}){
  const doc=frame.contentDocument,win=frame.contentWindow,failures=[],check=(ok,reason)=>{if(!ok)failures.push(reason);};
  check(!doc.body.dataset.observerError,doc.body.dataset.observerError);
  check([...doc.querySelectorAll('link[rel="stylesheet"]')].every(link=>link.sheet),'stylesheet missing');
  check(win.innerWidth===c.w&&win.innerHeight===c.h,'incorrect iframe viewport');
  const sheet=doc.querySelector('.ty-horizontal-product-filters-dropdown__content'),action=sheet.querySelector(c.desktop?'.ux01-action-done':'.ux01-action-mobile'),other=sheet.querySelector(c.desktop?'.ux01-action-mobile':'.ux01-action-done');
  const box=rect(action),sheetBox=rect(sheet);
  check(win.getComputedStyle(action).display!=='none'&&box.height>=44,'expected confirmation hidden or smaller than 44px');
  check(win.getComputedStyle(other).display==='none','wrong confirmation mode');
  check(box.top>=0&&box.bottom<=c.h+1&&box.left>=0&&box.right<=c.w+1,'confirmation outside viewport');
  const obstruction=[...doc.querySelectorAll('.ut2-sticky-panel__wrap,#bp_bottom_panel,.fixture-consent')].map(el=>({kind:el.className,rect:rect(el)}));
  obstruction.forEach(item=>check(!intersects(box,item.rect),'confirmation overlaps '+item.kind));
  if(!c.desktop&&obstruction.length)check(sheetBox.bottom<=Math.min(...obstruction.map(x=>x.rect.top))+1,'sheet extends into bottom obstruction');
  if(!c.desktop&&!obstruction.length)check(Math.abs(c.h-sheetBox.bottom)<=1,'no-native control has unnecessary bottom gap');
  const hits=[4,box.height/2,box.height-4].map(offset=>doc.elementFromPoint((box.left+box.right)/2,box.top+offset));
  check(hits.every(hit=>hit&&(hit===action||action.contains(hit))),'confirmation tap target obstructed');
  const native=doc.querySelector('.ut2-sticky-panel__wrap');
  if(native)check(Math.abs(rect(native).height-(c.preview?56:66))<=1,'fixture native bar height differs from native mode');
  if(c.preview){const previewHeight=parseFloat(win.getComputedStyle(doc.documentElement).getPropertyValue('--bp-bottom-panel-height'));check(previewHeight>0&&Math.abs(rect(doc.querySelector('#bp_bottom_panel')).height-previewHeight)<=1,'fixture preview differs from native CSS variable');}
  return {id:c.id,pass:!failures.length,failures,action:box,sheet:sheetBox,inset:win.getComputedStyle(doc.documentElement).getPropertyValue('--ux01-consent-inset'),obstruction,hitTargets:hits.map(hit=>hit?hit.tagName+'.'+hit.className:null)};
}
async function run(){
  const button=document.querySelector('#check');button.disabled=true;
  try{
    await ready;await Promise.all(frames.map(item=>item.loaded));
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    const results=frames.map(inspect);document.querySelector('#result').textContent=JSON.stringify({fixtureOnly:true,pass:results.every(item=>item.pass),source:sourceInfo,results},null,2);
  }catch(error){document.querySelector('#result').textContent=JSON.stringify({fixtureOnly:true,pass:false,error:String(error)});}
  finally{button.disabled=false;}
}
document.querySelector('#check').addEventListener('click',run);run();
</script>
</html>
