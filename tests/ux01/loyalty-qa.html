<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>UX-01 · проверка бонусного интерфейса dev_copy</title>
<style>
body{margin:0;background:#eee;color:#30291f;font:14px system-ui}
header{position:sticky;top:0;z-index:2;background:white;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{min-height:40px;padding:6px 12px;cursor:pointer}
iframe{display:block;border:0;width:390px;height:900px;background:white}
details{background:white;padding:8px}pre{white-space:pre-wrap;max-height:330px;overflow:auto}
</style>
<header><strong>UX-01 · dev_copy</strong>
<button data-width="375">375</button><button data-width="390">390</button><button data-width="430">430</button>
<button data-width="1366">1366</button><button data-width="1440">1440</button>
<button id="audit">Проверить бонусы и HTTP</button><span id="status" role="status">Ожидание проверки</span></header>
<details><summary>Фактический протокол</summary><pre id="result">Не проверено</pre></details>
<iframe id="storefront" title="Настоящая авторизованная витрина"></iframe>
<script src="cashback-visual-contract.js"></script>
<script>
'use strict';
if(location.origin!=='https://talario.ru'||location.pathname!=='/dev_copy/tests/ux01/loyalty-qa.html'){
  document.body.textContent='Только dev_copy';
}else{
  const frame=document.getElementById('storefront');frame.src='/dev_copy/';
  document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
    frame.style.width=button.dataset.width+'px';
    document.getElementById('status').textContent='Ширина '+button.dataset.width+' CSS px';
  }));
  document.getElementById('audit').addEventListener('click',async()=>{
    const status=document.getElementById('status');status.textContent='Проверка…';
    try{
      const doc=frame.contentDocument;
      const surface=auditCashbackSurface(doc);
      const response=await fetch('/dev_copy/index.php?dispatch=ux01_loyalty.balance',{
        credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}
      });
      const data=await response.json();
      const profile=doc.querySelector('#talario-ux01 .header-actions .user-link');
      const balance=profile&&profile.querySelector('.ux01-header-balance');
      const cardCount=doc.querySelectorAll('.activity').length;
      const result={scope:'actual storefront, responsive desktop UA; not a synthetic balance',
        surface,http:{status:response.status,contentType:response.headers.get('content-type'),
          cacheControl:response.headers.get('cache-control'),vary:response.headers.get('vary'),
          authenticated:data.authenticated,pointsType:typeof data.points,pointsIsInteger:Number.isInteger(data.points),
          balanceMatchesHeader:!!balance&&balance.textContent.replace(/[\s\u00a0\u202f]/g,'')===String(data.points)},
        header:{status:profile&&profile.getAttribute('data-ux01-balance-status'),visible:!!balance&&balance.getBoundingClientRect().width>0},
        layout:{width:doc.defaultView.innerWidth,client:doc.documentElement.clientWidth,scroll:doc.documentElement.scrollWidth},
        cards:cardCount,welcomeNodes:doc.querySelectorAll('.desktop-bonus,.mobile-bonus').length};
      document.getElementById('result').textContent=JSON.stringify(result,null,2);
      status.textContent=(surface.pass&&response.ok&&result.http.balanceMatchesHeader?'PASS':'Проверить результат')+' · '+cardCount+' реальных карточек';
    }catch(error){status.textContent='FAIL';document.getElementById('result').textContent=String(error);}
  });
}
</script>
</html>
